<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Plaine 3D météo — Amiens (debug)</title>
  <style>
    html,body { height:100%; margin:0; background:#000; font-family:system-ui,Segoe UI,Roboto,Arial; }
    #canvas { width:100%; height:100vh; display:block; }
    #hud {
      position:absolute; left:12px; top:12px; z-index:10;
      background:rgba(255,255,255,0.95); color:#111; padding:10px 14px; border-radius:8px;
      box-shadow:0 6px 18px rgba(0,0,0,0.18); font-weight:600; max-width:40%;
    }
    #detail { font-weight:400; font-size:13px; margin-top:6px; color:#333; }
    #credits { position:absolute; right:12px; bottom:12px; z-index:10;
      background:rgba(0,0,0,0.35); color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; }
    a { color: #06c; text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">Chargement météo...<div id="detail"></div></div>
  <div id="credits">Amiens (80000) — clic pour rafraîchir</div>

  <!-- Three.js UMD + OrbitControls (plus compatible quand on ouvre localement) -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

  <script>
  (function(){
    const LAT = 49.8941, LON = 2.2958;
    const UPDATE_MIN = 5;
    const hud = document.getElementById('hud');
    const detail = document.getElementById('detail');
    const canvas = document.getElementById('canvas');

    // Simple error reporting to HUD
    function report(msg){
      console.error(msg);
      hud.textContent = msg;
    }
    window.addEventListener('error', (e) => {
      report('Erreur JS: ' + (e.message || e));
    });
    window.addEventListener('unhandledrejection', (e) => {
      report('Promise rejetée: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });

    // WebGL availability check
    function isWebGLAvailable() {
      try {
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        return !!(gl && gl instanceof WebGLRenderingContext);
      } catch (e) { return false; }
    }
    if (!isWebGLAvailable()) {
      report("WebGL non disponible dans ce navigateur. Essaie un autre navigateur ou active l'accélération matérielle.");
      return;
    }
    // Check THREE loaded
    if (typeof THREE === 'undefined') {
      report("Three.js n'a pas pu se charger depuis le CDN. Vérifie la connexion internet.");
      return;
    }

    // Scene minimal mais fonctionnelle
    let renderer, scene, camera, controls;
    try {
      renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.shadowMap.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 12, 28);
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
    } catch (e) {
      report("Erreur initialisation three.js: " + e.message);
      return;
    }

    // Light
    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(10,20,10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024,1024);
    scene.add(sun);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(160,160,64,64);
    groundGeo.rotateX(-Math.PI/2);
    const groundMat = new THREE.MeshStandardMaterial({color:0x4CAF50, roughness:0.9});
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.receiveShadow = true;
    scene.add(ground);
    // Simple gentle hills
    const basePos = ground.geometry.attributes.position.array.slice();
    function deformGround(time){
      const pos = ground.geometry.attributes.position.array;
      for (let i=0;i<pos.length;i+=3){
        const x = basePos[i], z = basePos[i+2];
        pos[i+1] = Math.sin(x*0.05 + time*0.001) * 0.6 + Math.cos(z*0.04 + time*0.0012) * 0.4;
      }
      ground.geometry.attributes.position.needsUpdate = true;
      ground.geometry.computeVertexNormals();
    }

    // Main stylized tree
    function makeTree(isMain){
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(isMain?0.8:0.35, isMain?1.0:0.45, isMain?6:3.2, 10),
        new THREE.MeshStandardMaterial({color:0x7b4f2a})
      );
      trunk.position.y = (isMain?3:1.6);
      trunk.castShadow = true;
      g.add(trunk);
      const leafMat = new THREE.MeshStandardMaterial({color:0x1f8f3b});
      const layers = isMain?5:3;
      const baseR = isMain?4.0:1.6;
      for (let i=0;i<layers;i++){
        const s = baseR * (1 - i*0.12);
        const sph = new THREE.Mesh(new THREE.SphereGeometry(s, 16, 12), leafMat);
        sph.position.y = (i*(isMain?0.9:0.65)) + (isMain?4.0:1.1);
        sph.castShadow = true;
        g.add(sph);
      }
      return g;
    }
    const mainTree = makeTree(true);
    mainTree.position.set(0,0,0);
    scene.add(mainTree);
    // small cluster of trees
    for (let i=0;i<12;i++){
      const t = makeTree(false);
      const r = 10 + Math.random()*48;
      const ang = Math.random()*Math.PI*2;
      t.position.set(Math.cos(ang)*r, 0, Math.sin(ang)*r);
      t.scale.setScalar(0.8 + Math.random()*0.8);
      t.rotation.y = (Math.random()-0.5)*0.6;
      scene.add(t);
    }

    // clouds (simple sprites)
    const cloudCanvas = document.createElement('canvas');
    cloudCanvas.width = 256; cloudCanvas.height = 128;
    const c2 = cloudCanvas.getContext('2d');
    const grd = c2.createRadialGradient(120,64,10,120,64,120);
    grd.addColorStop(0,'rgba(255,255,255,1)');
    grd.addColorStop(1,'rgba(255,255,255,0)');
    c2.fillStyle = grd; c2.fillRect(0,0,256,128);
    const cloudTex = new THREE.CanvasTexture(cloudCanvas);
    const cloudMat = new THREE.SpriteMaterial({map:cloudTex, opacity:0.9});
    const clouds = [];
    for (let i=0;i<5;i++){
      const s = new THREE.Sprite(cloudMat);
      s.scale.set(12 + Math.random()*18, 6 + Math.random()*6, 1);
      s.position.set((Math.random()-0.5)*140, 12 + Math.random()*6, (Math.random()-0.5)*80);
      scene.add(s);
      clouds.push(s);
    }

    // weather state
    const state = { weatherType:'clear', temperature:12, wind:3, intensity:0, timeOfDay:'day' };

    function weatherCodeToType(code){
      if (code === 0) return 'clear';
      if (code === 1 || code === 2) return 'partly_cloudy';
      if (code === 3) return 'cloudy';
      if (code === 45 || code === 48) return 'fog';
      if (code >= 51 && code <= 57) return 'drizzle';
      if (code >= 61 && code <= 67) return 'rain';
      if (code >= 71 && code <= 77) return 'snow';
      if (code >= 80 && code <= 82) return 'rain';
      if (code >= 85 && code <= 86) return 'snow';
      if (code >= 95 && code <= 99) return 'thunder';
      return 'cloudy';
    }

    async function fetchWeather(){
      try {
        hud.textContent = 'Mise à jour météo...';
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&timezone=Europe%2FParis`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Erreur réseau: ' + res.status);
        const json = await res.json();
        if (!json.current_weather) throw new Error('Aucune donnée météo reçue');
        const cw = json.current_weather;
        state.weatherType = weatherCodeToType(cw.weathercode);
        state.temperature = Math.round(cw.temperature);
        state.wind = cw.windspeed || 0;
        state.intensity = Math.min(1, (cw.windspeed || 0)/25);
        const localHour = new Date(cw.time + '+02:00').getHours();
        state.timeOfDay = (localHour>=6 && localHour<20)?'day':'night';
        hud.innerHTML = `Amiens — ${state.temperature}°C — ${state.weatherType} — vent ${Math.round(state.wind)} km/h` +
                        `<div id="detail">Clique pour rafraîchir</div>`;
        applyWeather();
      } catch (err) {
        report('Impossible de récupérer la météo: ' + (err.message||err));
      }
    }

    function applyWeather(){
      // clouds opacity and height
      clouds.forEach((c,i)=>{
        if (state.weatherType === 'clear') { c.material.opacity = 0.25; c.position.y = 10 + i*0.6; }
        else if (state.weatherType === 'partly_cloudy') { c.material.opacity = 0.6; c.position.y = 12 + i; }
        else { c.material.opacity = 0.9; c.position.y = 14 + i*0.8; }
      });
      // fog / sky
      if (state.timeOfDay === 'day') {
        renderer.setClearColor(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.0009 + state.intensity*0.002);
        hemi.intensity = 0.6;
        sun.intensity = 1.0;
      } else {
        renderer.setClearColor(0x081226);
        scene.fog = new THREE.FogExp2(0x081226, 0.001 + state.intensity*0.002);
        hemi.intensity = 0.15;
        sun.intensity = 0.2;
      }
    }

    // animation loop
    let last = performance.now();
    function animate(t){
      requestAnimationFrame(animate);
      const dt = (t - last)/1000; last = t;
      deformGround(t);
      // clouds drift with wind
      clouds.forEach((c,i)=>{
        c.position.x += (0.01 + state.wind*0.01) * (i%2?1:-1);
        if (c.position.x > 120) c.position.x = -120;
      });
      // main tree slight sway with wind
      mainTree.rotation.z = Math.sin(t*0.0008) * (0.01 + state.wind*0.01);
      controls.update();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.render(scene, camera);
    }

    // clicks refresh weather
    canvas.addEventListener('click', () => fetchWeather());
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // Start
    fetchWeather();
    setInterval(fetchWeather, UPDATE_MIN * 60 * 1000);
    animate(performance.now());
  })();
  </script>
</body>
</html>
