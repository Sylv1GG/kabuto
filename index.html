<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Plaine 3D météo — Amiens (fix)</title>
  <style>
    html,body { height:100%; margin:0; background:#000; font-family:system-ui,Segoe UI,Roboto,Arial; }
    #canvas { width:100%; height:100vh; display:block; }
    #hud {
      position:absolute; left:12px; top:12px; z-index:10;
      background:rgba(255,255,255,0.95); color:#111; padding:10px 14px; border-radius:8px;
      box-shadow:0 6px 18px rgba(0,0,0,0.18); font-weight:600; max-width:40%;
    }
    #detail { font-weight:400; font-size:13px; margin-top:6px; color:#333; }
    #credits { position:absolute; right:12px; bottom:12px; z-index:10;
      background:rgba(0,0,0,0.35); color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>


  AZERTY
  <div id="hud">Chargement météo...<div id="detail"></div></div>
  <div id="credits">Amiens (80000) — clic pour rafraîchir</div>

  <!-- Three.js UMD (no OrbitControls) -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

  <script>
  (function(){
    const LAT = 49.8941, LON = 2.2958;
    const UPDATE_MIN = 5;
    const hud = document.getElementById('hud');
    const detail = document.getElementById('detail');
    const canvas = document.getElementById('canvas');

    function report(msg){
      console.error(msg);
      hud.textContent = msg;
    }
    window.addEventListener('error', (e) => { report('Erreur JS: ' + (e.message || e)); });
    window.addEventListener('unhandledrejection', (e) => { report('Promise rejetée: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });

    function isWebGLAvailable() {
      try {
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        return !!(gl && gl instanceof WebGLRenderingContext);
      } catch (e) { return false; }
    }
    if (!isWebGLAvailable()) { report("WebGL non disponible. Essaie un autre navigateur ou active l'accélération matérielle."); return; }
    if (typeof THREE === 'undefined') { report("Three.js n'a pas pu se charger depuis le CDN."); return; }

    // Renderer / scene / camera
    const renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.shadowMap.enabled = true;
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.0009);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);

    // Custom simple orbit controls (drag to rotate, wheel to zoom)
    let target = new THREE.Vector3(0, 1.5, 0);
    let camRadius = 28;
    let theta = Math.PI * 0.3; // azimuth
    let phi = Math.PI * 0.35;   // polar (from y axis)
    let targetTheta = theta, targetPhi = phi, targetRadius = camRadius;
    function updateCamera() {
      // clamp phi
      targetPhi = Math.max(0.12, Math.min(1.45, targetPhi));
      camRadius = Math.max(6, Math.min(120, targetRadius));
      const r = camRadius;
      const x = target.x + r * Math.sin(targetPhi) * Math.cos(targetTheta);
      const y = target.y + r * Math.cos(targetPhi);
      const z = target.z + r * Math.sin(targetPhi) * Math.sin(targetTheta);
      camera.position.set(x, y, z);
      camera.lookAt(target);
    }
    updateCamera();

    // Pointer handling
    let isDown = false;
    let startX = 0, startY = 0;
    let startTheta = 0, startPhi = 0;
    canvas.style.touchAction = "none";
    canvas.addEventListener('pointerdown', (e) => {
      isDown = true;
      startX = e.clientX; startY = e.clientY;
      startTheta = targetTheta; startPhi = targetPhi;
      canvas.setPointerCapture(e.pointerId);
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDown) return;
      const dx = (e.clientX - startX) / window.innerWidth;
      const dy = (e.clientY - startY) / window.innerHeight;
      targetTheta = startTheta - dx * Math.PI * 1.6;
      targetPhi = startPhi + dy * Math.PI;
    });
    window.addEventListener('pointerup', (e) => { isDown = false; });

    // Wheel zoom
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetRadius = targetRadius + e.deltaY * 0.02;
    }, {passive:false});

    // Basic lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(10,20,10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024,1024);
    scene.add(sun);

    // Ground (plane with vertex displacement)
    const groundGeo = new THREE.PlaneGeometry(160,160,120,120);
    groundGeo.rotateX(-Math.PI/2);
    const groundMat = new THREE.MeshStandardMaterial({color:0x4CAF50, roughness:0.9});
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.receiveShadow = true;
    scene.add(ground);
    const basePos = ground.geometry.attributes.position.array.slice();

    // Grass blades instanced (light)
    const bladeCount = 600;
    const bladesGeo = new THREE.PlaneGeometry(0.12, 0.9);
    const bladesMat = new THREE.MeshStandardMaterial({color:0x1e6b29, side: THREE.DoubleSide, roughness:0.9});
    const blades = new THREE.InstancedMesh(bladesGeo, bladesMat, bladeCount);
    blades.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const dummy = new THREE.Object3D();
    for (let i=0;i<bladeCount;i++){
      const x = (Math.random()-0.5) * 120;
      const z = (Math.random()-0.5) * 120;
      dummy.position.set(x, 0.02 + Math.random()*0.02, z);
      dummy.rotation.y = Math.random()*Math.PI;
      const s = 0.6 + Math.random()*0.9;
      dummy.scale.set(s*0.8, s, 1);
      dummy.updateMatrix();
      blades.setMatrixAt(i, dummy.matrix);
    }
    scene.add(blades);

    // Tree factory
    function makeTree(isMain){
      const g = new THREE.Group();
      const trunkGeo = new THREE.CylinderGeometry(isMain?0.8:0.35, isMain?1.0:0.45, isMain?6:3.2, 10);
      const trunkMat = new THREE.MeshStandardMaterial({color:0x7b4f2a});
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = (isMain?3:1.6);
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      g.add(trunk);
      const leafMat = new THREE.MeshStandardMaterial({color:0x1f8f3b, flatShading:true});
      const layers = isMain?5:3;
      const baseR = isMain?4.0:1.6;
      for (let i=0;i<layers;i++){
        const s = baseR * (1 - i*0.12);
        const sph = new THREE.Mesh(new THREE.SphereGeometry(s, 16, 12), leafMat);
        sph.position.y = (i*(isMain?0.9:0.65)) + (isMain?4.0:1.1);
        sph.castShadow = true;
        sph.receiveShadow = true;
        sph.position.x += (Math.random()-0.5) * (isMain?0.6:0.2);
        sph.position.z += (Math.random()-0.5) * (isMain?0.6:0.2);
        g.add(sph);
      }
      g.userData = { swayOffset: Math.random()*1000 };
      return g;
    }

    const mainTree = makeTree(true);
    mainTree.position.set(0,0,0);
    scene.add(mainTree);
    for (let i=0;i<18;i++){
      const t = makeTree(false);
      const r = 10 + Math.random()*48;
      const ang = Math.random()*Math.PI*2;
      t.position.set(Math.cos(ang)*r, 0, Math.sin(ang)*r);
      t.scale.setScalar(0.8 + Math.random()*0.8);
      t.rotation.y = (Math.random()-0.5)*0.6;
      scene.add(t);
    }

    // Clouds sprites
    const cloudCanvas = document.createElement('canvas');
    cloudCanvas.width = 256; cloudCanvas.height = 128;
    const ctx2 = cloudCanvas.getContext('2d');
    const grd = ctx2.createRadialGradient(120,64,10,120,64,120);
    grd.addColorStop(0,'rgba(255,255,255,1)');
    grd.addColorStop(1,'rgba(255,255,255,0)');
    ctx2.fillStyle = grd; ctx2.fillRect(0,0,256,128);
    const cloudTex = new THREE.CanvasTexture(cloudCanvas);
    const cloudMat = new THREE.SpriteMaterial({map:cloudTex, opacity:0.9});
    const cloudSprites = [];
    for (let i=0;i<6;i++){
      const s = new THREE.Sprite(cloudMat);
      s.scale.set(12 + Math.random()*20, 6 + Math.random()*6, 1);
      s.position.set((Math.random()-0.5)*140, 12 + Math.random()*8, (Math.random()-0.5)*80);
      scene.add(s);
      cloudSprites.push(s);
    }

    // Particles placeholders (we'll create on demand)
    let rainPoints = null, rainGeo = null, rainVel = null;
    let snowPoints = null, snowGeo = null, snowVel = null;

    function createRain(count=800){
      if (rainPoints) { scene.remove(rainPoints); rainPoints.geometry.dispose(); rainPoints.material.dispose(); rainPoints = null; }
      rainGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(count*3);
      rainVel = new Float32Array(count);
      for (let i=0;i<count;i++){
        positions[i*3] = (Math.random()-0.5)*140;
        positions[i*3+1] = Math.random()*40 + 5;
        positions[i*3+2] = (Math.random()-0.5)*140;
        rainVel[i] = 20 + Math.random()*10;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
      const material = new THREE.PointsMaterial({color:0x9bd1ff, size:0.12, transparent:true, opacity:0.85, depthWrite:false});
      rainPoints = new THREE.Points(rainGeo, material);
      scene.add(rainPoints);
    }
    function createSnow(count=600){
      if (snowPoints) { scene.remove(snowPoints); snowPoints.geometry.dispose(); snowPoints.material.dispose(); snowPoints = null; }
      snowGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(count*3);
      snowVel = new Float32Array(count);
      for (let i=0;i<count;i++){
        positions[i*3] = (Math.random()-0.5)*140;
        positions[i*3+1] = Math.random()*40 + 5;
        positions[i*3+2] = (Math.random()-0.5)*140;
        snowVel[i] = 1 + Math.random()*1.6;
      }
      snowGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
      const material = new THREE.PointsMaterial({color:0xffffff, size:0.22, transparent:true, opacity:0.95, depthWrite:false});
      snowPoints = new THREE.Points(snowGeo, material);
      scene.add(snowPoints);
    }

    // Weather mapping
    function weatherCodeToType(code) {
      if (code === 0) return 'clear';
      if (code === 1 || code === 2) return 'partly_cloudy';
      if (code === 3) return 'cloudy';
      if (code === 45 || code === 48) return 'fog';
      if (code >= 51 && code <= 57) return 'drizzle';
      if (code >= 61 && code <= 67) return 'rain';
      if (code >= 71 && code <= 77) return 'snow';
      if (code >= 80 && code <= 82) return 'rain';
      if (code >= 85 && code <= 86) return 'snow';
      if (code >= 95 && code <= 99) return 'thunder';
      return 'cloudy';
    }

    const state = { weatherType:'clear', temperature:12, wind:3, intensity:0, timeOfDay:'day' };

    async function fetchWeather(){
      try {
        hud.textContent = 'Mise à jour météo...';
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&timezone=Europe%2FParis`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Erreur réseau: ' + res.status);
        const json = await res.json();
        if (!json.current_weather) throw new Error('Aucune donnée météo reçue');
        const cw = json.current_weather;
        state.weatherType = weatherCodeToType(cw.weathercode);
        state.temperature = Math.round(cw.temperature);
        state.wind = cw.windspeed || 0;
        state.intensity = Math.min(1, (cw.windspeed || 0)/25);
        const localHour = new Date(cw.time + '+02:00').getHours();
        state.timeOfDay = (localHour>=6 && localHour<20)?'day':'night';
        hud.innerHTML = `Amiens — ${state.temperature}°C — ${state.weatherType} — vent ${Math.round(state.wind)} km/h` +
                        `<div id="detail">Clique pour rafraîchir</div>`;
        applyWeather();
      } catch (err) {
        report('Impossible de récupérer la météo: ' + (err.message||err));
      }
    }

    function applyWeather(){
      // clouds
      cloudSprites.forEach((c,i)=>{
        if (state.weatherType === 'clear') { c.material.opacity = 0.25; c.position.y = 10 + i*0.6; }
        else if (state.weatherType === 'partly_cloudy') { c.material.opacity = 0.6; c.position.y = 12 + i; }
        else { c.material.opacity = 0.9; c.position.y = 14 + i*0.8; }
      });

      // rain / snow
      if (state.weatherType === 'rain' || state.weatherType === 'drizzle' || state.weatherType === 'thunder') {
        createRain(Math.floor(500 + state.intensity * 1200));
        if (snowPoints) { scene.remove(snowPoints); snowPoints = null; }
        scene.fog.density = 0.002 + state.intensity*0.006;
      } else if (state.weatherType === 'snow') {
        createSnow(Math.floor(300 + state.intensity * 800));
        if (rainPoints) { scene.remove(rainPoints); rainPoints = null; }
        scene.fog.density = 0.002 + state.intensity*0.006;
      } else {
        if (rainPoints) { scene.remove(rainPoints); rainPoints = null; }
        if (snowPoints) { scene.remove(snowPoints); snowPoints = null; }
        scene.fog.density = 0.0009;
      }

      // day/night
      if (state.timeOfDay === 'day') {
        renderer.setClearColor(0x87CEEB);
        scene.fog.color.setHex(0x87CEEB);
        hemi.intensity = 0.6;
        sun.intensity = 1.0;
        sun.color.setHex(0xffffff);
        sun.position.set(10,25,8);
      } else {
        renderer.setClearColor(0x081226);
        scene.fog.color.setHex(0x081226);
        hemi.intensity = 0.15;
        sun.intensity = 0.2;
        sun.color.setHex(0xaaaaff);
        sun.position.set(-5,8,-10);
      }
      // wind affects sway handled in loop via state.wind
      targetRadius = camRadius; // keep zoom stable when weather changes
    }

    // Animation
    let last = performance.now();
    function animate(t){
      requestAnimationFrame(animate);
      const dt = (t - last)/1000; last = t;

      // Smooth camera interpolation
      theta += (targetTheta - theta) * 0.12;
      phi += (targetPhi - phi) * 0.12;
      camRadius += (targetRadius - camRadius) * 0.12;
      updateCamera();

      // deform ground
      const pos = ground.geometry.attributes.position.array;
      for (let i=0;i<pos.length;i+=3){
        const bx = basePos[i], bz = basePos[i+2];
        const d = Math.sin(bx*0.06 + t*0.0007) * 0.6 + Math.cos(bz*0.05 + t*0.0009) * 0.4;
        const windEffect = Math.sin((bx + bz)*0.02 + t*0.0009) * (state.wind*0.015);
        pos[i+1] = (d * 0.9) + windEffect * 0.6;
      }
      ground.geometry.attributes.position.needsUpdate = true;
      ground.geometry.computeVertexNormals();

      // blades sway
      for (let i=0;i<bladeCount;i++){
        blades.getMatrixAt(i, dummy.matrix);
        dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
        const sway = Math.sin(t*0.001 + i) * (0.02 + state.wind*0.006);
        dummy.rotation.set(0, 0, sway);
        dummy.updateMatrix();
        blades.setMatrixAt(i, dummy.matrix);
      }
      blades.instanceMatrix.needsUpdate = true;

      // trees sway
      scene.children.forEach(obj => {
        if (obj.userData && obj.userData.swayOffset !== undefined) {
          const s = Math.sin(t*0.0015 + obj.userData.swayOffset) * (0.02 + state.wind*0.01);
          obj.rotation.z = s * (obj === mainTree ? 1.6 : 1.0);
        }
      });

      // clouds drift
      cloudSprites.forEach((c,i)=>{
        c.position.x += (0.02 + state.wind*0.02) * (i%2?1:-1);
        if (c.position.x > 140) c.position.x = -140;
        if (c.position.x < -140) c.position.x = 140;
      });

      // rain update
      if (rainPoints && rainGeo) {
        const p = rainGeo.attributes.position.array;
        for (let i=0;i<p.length;i+=3){
          p[i+1] -= rainVel[i/3] * dt;
          p[i] += (state.wind * 0.05) * dt * 40;
          if (p[i+1] < 0) {
            p[i+1] = 40 + Math.random()*10;
            p[i] = (Math.random()-0.5)*140;
            p[i+2] = (Math.random()-0.5)*140;
          }
        }
        rainGeo.attributes.position.needsUpdate = true;
      }
      if (snowPoints && snowGeo) {
        const p = snowGeo.attributes.position.array;
        for (let i=0;i<p.length;i+=3){
          p[i+1] -= snowVel[i/3] * dt;
          p[i] += Math.sin((t*0.0003 + i)) * 0.02 + state.wind*0.02;
          if (p[i+1] < 0) {
            p[i+1] = 40 + Math.random()*10;
            p[i] = (Math.random()-0.5)*140;
            p[i+2] = (Math.random()-0.5)*140;
          }
        }
        snowGeo.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    // Interactions
    canvas.addEventListener('click', () => fetchWeather());
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // Start
    fetchWeather();
    setInterval(fetchWeather, UPDATE_MIN * 60 * 1000);
    animate(performance.now());
  })();
  </script>
</body>
</html>
