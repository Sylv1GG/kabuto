<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Horloge & XP — Mini site</title>

  <!-- Google Font moderne -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
  :root{
    --bg:#0f1724;
    --card: rgba(255,255,255,0.06);
    --accent: #7c5cff;
    --accent-2: #00d4ff;
    --glass: rgba(255,255,255,0.04);
    --text: #e6eef8;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  body{
    background: radial-gradient(1200px 600px at 10% 10%, rgba(124,92,255,0.12), transparent),
                radial-gradient(900px 400px at 90% 90%, rgba(0,212,255,0.06), transparent),
                var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* Container */
  .app{
    width:100%;
    max-width:980px;
    min-height:620px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:16px;
    padding:28px;
    position:relative;
    box-shadow: 0 10px 40px rgba(2,6,23,0.6);
    overflow:hidden;
  }

  /* Weather button top-left */
  .weather-btn{
    position:absolute;
    top:18px;
    left:18px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border:none;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(124,92,255,0.18);
  }

  /* Top area for level */
  .top{
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
  }

  /* Level card */
  .level-card{
    width:260px;
    background:var(--card);
    border-radius:12px;
    padding:12px;
    backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.03);
  }
  .level-info{display:flex;flex-direction:column;gap:6px}
  #levelText{font-weight:700;font-size:18px;letter-spacing:0.4px}
  #xpText{font-size:13px;color:rgba(230,238,248,0.8)}

  /* XP bar */
  .xp-bar{height:12px;background:rgba(255,255,255,0.04);border-radius:8px;margin-top:10px;overflow:hidden}
  .xp-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width 800ms cubic-bezier(.2,.9,.3,1);
  }

  /* Main clock */
  .main{display:flex;align-items:center;justify-content:center;height:calc(100% - 160px)}
  .clock-card{
    text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    padding:36px 48px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.03);
    box-shadow: 0 6px 30px rgba(2,6,23,0.45);
    min-width:420px;
  }
  .time{
    font-size:72px;
    font-weight:800;
    letter-spacing:1px;
    color:transparent;
    /* gradient text cross-browser */
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-fill-color:transparent;
  }
  .date{
    margin-top:8px;
    color:rgba(230,238,248,0.85);
    font-weight:500;
  }

  /* Weather panel (side) */
  .weather-panel{
    position:absolute;
    top:18px;
    left:18px;
    transform:translateX(-8px);
    width:320px;
    max-width:calc(100% - 40px);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:12px;
    padding:16px;
    border:1px solid rgba(255,255,255,0.04);
    box-shadow:0 18px 40px rgba(2,6,23,0.55);
    z-index:30;
    display:none;
  }
  .weather-panel.show{display:block}
  .weather-panel h3{margin:0 0 8px 0}
  .close{position:absolute;right:8px;top:8px;border:none;background:none;color:var(--text);font-size:16px;cursor:pointer}
  .weather-content p{margin:12px 0;color:rgba(230,238,248,0.9)}
  .weather-row{display:flex;align-items:center;gap:12px}
  .weather-temp{font-size:36px;font-weight:700}
  .weather-desc{font-weight:500;color:rgba(230,238,248,0.85)}
  .location-name{font-size:13px;color:rgba(230,238,248,0.75);margin-bottom:8px}

  /* Footer */
  .footer{position:absolute;bottom:18px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center}
  .controls button{margin-right:8px;padding:8px 12px;border-radius:8px;border:none;background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer}
  .credit{font-size:13px;color:rgba(230,238,248,0.65)}

  /* Small animations */
  #levelCard.flash { box-shadow: 0 0 0 6px rgba(124,92,255,0.12), 0 12px 30px rgba(2,6,23,0.6); transform:translateY(-6px); transition:transform .25s ease; }
  #levelCard { transition: transform .2s ease, box-shadow .3s ease; }

  /* Responsive */
  @media (max-width:600px){
    .clock-card{min-width:unset;padding:24px}
    .time{font-size:44px}
    .level-card{width:100%}
    .weather-panel{width:92%}
  }
  </style>
</head>
<body>
  <div class="app">
    <button id="weather-btn" class="weather-btn" aria-expanded="false" title="Météo (haut gauche)">
      ☀️ Météo
    </button>

    <header class="top">
      <div class="level-card" id="levelCard" role="status" aria-live="polite">
        <div class="level-info">
          <div id="levelText">Niveau 1</div>
          <div id="xpText">XP: 0 / 100</div>
        </div>
        <div class="xp-bar" aria-hidden="true">
          <div id="xpFill" class="xp-fill"></div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="clock-card">
        <div id="time" class="time">--:--:--</div>
        <div id="date" class="date">--</div>
      </div>
    </main>

    <!-- Panneau météo -->
    <aside id="weatherPanel" class="weather-panel" aria-hidden="true">
      <button id="closeWeather" class="close" aria-label="Fermer panneau météo">✕</button>
      <h3>Météo locale</h3>
      <div id="locationName" class="location-name" aria-hidden="true"></div>
      <div id="weatherContent" class="weather-content">
        <p>Clique sur "Météo" pour récupérer la position et afficher la météo.</p>
      </div>
      <div class="weather-actions" style="margin-top:12px;display:flex;gap:8px;">
        <button id="forceLocation">Rafraîchir</button>
        <button id="fallbackCity">Entrer une ville</button>
      </div>
    </aside>

    <footer class="footer">
      <div class="controls">
        <button id="addXP">+ XP (test)</button>
        <button id="resetXP">Réinitialiser</button>
      </div>
      <div class="credit">Fait pour le kiffe — Horloge & XP</div>
    </footer>
  </div>

  <script>
  // Petit site Horloge + Météo + XP — tout dans ce fichier
  // -------- Configuration XP ----------
  const XP_PER_MINUTE = 10; // XP gagné chaque minute
  const STORAGE_KEY = "mini_clock_xp_v1";

  // XP -> palier suivant (exponentiel doux)
  function xpToNextLevel(level){
    return Math.floor(100 * Math.pow(1.5, level-1));
  }

  // -------- State (sauvegardé) ----------
  let state = { xp: 0, level: 1 };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(typeof parsed.xp === "number" && typeof parsed.level === "number"){
          state = parsed;
        }
      }
    }catch(e){ console.warn("loadState:", e) }
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn("saveState:", e) }
  }

  // -------- Clock UI ----------
  const timeEl = document.getElementById("time");
  const dateEl = document.getElementById("date");
  function pad(n){ return n < 10 ? "0"+n : n; }

  function updateClock(){
    const now = new Date();
    const hours = pad(now.getHours());
    const minutes = pad(now.getMinutes());
    const seconds = pad(now.getSeconds());
    timeEl.textContent = `${hours}:${minutes}:${seconds}`;
    dateEl.textContent = now.toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});
  }

  // start clock
  updateClock();
  setInterval(updateClock, 1000);

  // -------- XP UI ----------
  const levelText = document.getElementById("levelText");
  const xpText = document.getElementById("xpText");
  const xpFill = document.getElementById("xpFill");
  const levelCardEl = document.getElementById("levelCard");

  function renderXP(){
    const next = xpToNextLevel(state.level);
    const pct = Math.min(100, Math.round(100 * state.xp / next));
    levelText.textContent = `Niveau ${state.level}`;
    xpText.textContent = `XP: ${state.xp} / ${next}`;
    xpFill.style.width = pct + "%";
  }

  function addXP(amount){
    state.xp += amount;
    while(state.xp >= xpToNextLevel(state.level)){
      state.xp -= xpToNextLevel(state.level);
      state.level++;
      flashLevel();
    }
    saveState();
    renderXP();
  }

  function flashLevel(){
    levelCardEl.classList.add("flash");
    setTimeout(()=>levelCardEl.classList.remove("flash"), 900);
  }

  loadState();
  renderXP();

  // add XP automatically toutes les minutes
  setInterval(()=> addXP(XP_PER_MINUTE), 60_000);

  // Controls
  document.getElementById("addXP").addEventListener("click", ()=> addXP(25));
  document.getElementById("resetXP").addEventListener("click", ()=>{
    if(confirm("Réinitialiser l'XP et le niveau ?")){
      state = {xp:0, level:1};
      saveState();
      renderXP();
    }
  });

  // -------- Weather (Open-Meteo, pas de clé) ----------
  const weatherBtn = document.getElementById("weather-btn");
  const weatherPanel = document.getElementById("weatherPanel");
  const weatherContent = document.getElementById("weatherContent");
  const closeWeather = document.getElementById("closeWeather");
  const forceLocation = document.getElementById("forceLocation");
  const fallbackCity = document.getElementById("fallbackCity");
  const locationNameEl = document.getElementById("locationName");

  weatherBtn.addEventListener("click", async ()=>{
    toggleWeather(true);
    await showWeather();
  });

  closeWeather.addEventListener("click", ()=> toggleWeather(false));
  forceLocation.addEventListener("click", async ()=> await showWeather());
  fallbackCity.addEventListener("click", async ()=>{
    const city = prompt("Entrez le nom d'une ville (ex: Paris) :");
    if(city) await fetchWeatherByCity(city);
  });

  function toggleWeather(show){
    weatherPanel.classList.toggle("show", show);
    weatherPanel.setAttribute("aria-hidden", (!show).toString());
    weatherBtn.setAttribute("aria-expanded", show.toString());
  }

  // Geolocation + fallback IP
  async function showWeather(){
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Récupération de la position...</p>";
    // Try navigator.geolocation first
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        await fetchWeather(lat, lon);
      }, async (err) => {
        // If user denied or error, try IP fallback
        console.warn("Geolocation error:", err);
        weatherContent.innerHTML = `<p>Position non autorisée ou indisponible, tentative de fallback IP...</p>`;
        const ip = await tryIPLocation();
        if(ip) await fetchWeather(ip.latitude, ip.longitude, ip.city ? `${ip.city}${ip.region ? ', '+ip.region : ''}${ip.country_name ? ', '+ip.country_name : ''}` : null);
        else weatherContent.innerHTML = `<p>Impossible d'obtenir la position: ${err.message}</p>`;
      }, {timeout:10000});
    }else{
      const ip = await tryIPLocation();
      if(ip) await fetchWeather(ip.latitude, ip.longitude, ip.city ? `${ip.city}${ip.region ? ', '+ip.region : ''}${ip.country_name ? ', '+ip.country_name : ''}` : null);
      else weatherContent.innerHTML = "<p>Géolocalisation non disponible.</p>";
    }
  }

  // Try IP-based geolocation (approx.)
  async function tryIPLocation(){
    try{
      const res = await fetch('https://ipapi.co/json/');
      if(!res.ok) return null;
      const data = await res.json();
      // ipapi returns latitude/longitude and city, region, country_name
      if(typeof data.latitude === 'undefined' || typeof data.longitude === 'undefined') return null;
      return data;
    }catch(e){
      console.warn("IP location failed:", e);
      return null;
    }
  }

  // Fetch weather and optionally a pre-known location name
  async function fetchWeather(lat, lon, knownLocationName = null){
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Chargement météo...</p>";
    try{
      // Open-Meteo current weather
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      const cw = data.current_weather;
      if(!cw){
        weatherContent.innerHTML = "<p>Météo indisponible.</p>";
        return;
      }
      // If we don't have a location name, try reverse geocoding to show the place
      if(!knownLocationName){
        try{
          const revUrl = `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1&language=fr`;
          const rres = await fetch(revUrl);
          if(rres.ok){
            const rdata = await rres.json();
            if(rdata.results && rdata.results.length > 0){
              const r = rdata.results[0];
              knownLocationName = `${r.name}${r.admin1 ? ', '+r.admin1 : ''}${r.country ? ', '+r.country : ''}${r.postal_code ? ' ('+r.postal_code+')' : ''}`;
            }
          }
        }catch(e){ /* ignore reverse errors */ }
      }

      // Display name if known
      if(knownLocationName){
        locationNameEl.textContent = knownLocationName;
        locationNameEl.setAttribute('aria-hidden','false');
      }else{
        locationNameEl.textContent = "";
        locationNameEl.setAttribute('aria-hidden','true');
      }

      const temp = cw.temperature;
      const wind = cw.windspeed;
      const code = cw.weathercode;
      const desc = weatherCodeToText(code);
      weatherContent.innerHTML = `
        <div class="weather-row" style="align-items:flex-start;">
          <div>
            <div class="weather-temp">${Math.round(temp)}°C</div>
            <div class="weather-desc">${desc}</div>
          </div>
        </div>
        <p>Vitesse du vent : ${wind} km/h</p>
        <p>Rafraîchis: ${new Date().toLocaleTimeString()}</p>
      `;
    }catch(e){
      weatherContent.innerHTML = `<p>Erreur météo: ${e.message}</p>`;
    }
  }

  // Simple fallback: géocodage via API open-meteo geocoding
  async function fetchWeatherByCity(city){
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Recherche de la ville...</p>";
    try{
      const gurl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr`;
      const gres = await fetch(gurl);
      if(!gres.ok) throw new Error(gres.statusText);
      const gdata = await gres.json();
      if(!gdata.results || gdata.results.length === 0){
        weatherContent.innerHTML = `<p>Ville introuvable: ${city}</p>`;
        return;
      }
      const r = gdata.results[0];
      const pretty = `${r.name}${r.admin1 ? ', '+r.admin1 : ''}${r.country ? ', '+r.country : ''}${r.postal_code ? ' ('+r.postal_code+')' : ''}`;
      await fetchWeather(r.latitude, r.longitude, pretty);
    }catch(e){
      weatherContent.innerHTML = `<p>Erreur géocodage: ${e.message}</p>`;
    }
  }

  // Convert weather code to texte simple (source: open-meteo)
  function weatherCodeToText(code){
    const map = {
      0: "Ciel clair",
      1: "Principalement ensoleillé",
      2: "Partiellement nuageux",
      3: "Couvert",
      45: "Brouillard",
      48: "Brouillard givrant",
      51: "Bruine légère",
      53: "Bruine modérée",
      55: "Bruine dense",
      56: "Bruine verglaçante",
      57: "Bruine verglaçante dense",
      61: "Pluie légère",
      63: "Pluie modérée",
      65: "Pluie forte",
      66: "Pluie verglaçante légère",
      67: "Pluie verglaçante forte",
      71: "Neige légère",
      73: "Neige modérée",
      75: "Neige forte",
      77: "Grains de neige",
      80: "Averses légères",
      81: "Averses modérées",
      82: "Averses violentes",
      85: "Averses de neige légères",
      86: "Averses de neige fortes",
      95: "Orage",
      96: "Orage avec grêle légère",
      99: "Orage avec grêle forte"
    };
    return map[code] || "Temps inconnu";
  }

  // Note: sur certains navigateurs, la géolocalisation nécessite HTTPS ou serveur local.
  // Si tu ouvres directement le fichier (file://) et la géoloc ne marche pas, lance un petit serveur:
  // - python3 -m http.server
  // - ou `npx http-server .`
  </script>
</body>
</html>
