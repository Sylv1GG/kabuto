<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre Interactif - Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #treeCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        #treeCanvas:active {
            cursor: grabbing;
        }

        /* UI Overlay */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 101;
        }

        .world-title {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-item label {
            display: block;
            opacity: 0.8;
            font-size: 0.9em;
        }

        .stat-item value {
            display: block;
            font-size: 1.3em;
            color: #2ecc71;
        }

        .progress-bar-container {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            border: 2px solid #667eea;
        }

        .progress-bar-label {
            font-size: 0.95em;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71 0%, #27ae60 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Actions Panel */
        .actions-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
            z-index: 102;
        }

        .action-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 2em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.6);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.8);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-tooltip {
            position: absolute;
            bottom: 85px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.85em;
            white-space: nowrap;
            border: 1px solid #667eea;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .action-btn:hover .action-tooltip {
            opacity: 1;
        }

        /* Floating Effects */
        .effects-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .floating-text {
            position: absolute;
            font-size: 1.8em;
            font-weight: bold;
            pointer-events: none;
            animation: float-up 2s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

        .exp-gain {
            color: #2ecc71;
        }

        /* Milestones */
        .milestone-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
            color: white;
            padding: 40px 60px;
            border-radius: 20px;
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            z-index: 200;
            box-shadow: 0 10px 60px rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes milestone-pop {
            0% {
                opacity: 0;
                transform: translate(-50%, -60%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -30%) scale(1);
            }
        }

        .milestone-message.show {
            animation: milestone-pop 3s ease-out forwards;
        }

        /* World Complete Modal */
        .world-complete-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .world-complete-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .world-complete-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 80px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            max-width: 600px;
        }

        .world-complete-content h1 {
            font-size: 3em;
            margin-bottom: 20px;
            animation: pop 0.5s ease-out;
        }

        .world-complete-content p {
            font-size: 1.5em;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .next-world-btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .next-world-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .world-title {
                font-size: 1.8em;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .action-btn {
                width: 60px;
                height: 60px;
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="treeCanvas"></canvas>
        
        <div class="ui-overlay">
            <div class="hud">
                <div class="world-title" id="worldTitle">Monde 1: Les Débuts</div>
                <div class="stats-row">
                    <div class="stat-item">
                        <label>Niveau</label>
                        <value id="level">1</value>
                    </div>
                    <div class="stat-item">
                        <label>EXP</label>
                        <value id="exp">0</value>
                    </div>
                    <div class="stat-item">
                        <label>Santé</label>
                        <value id="health">100%</value>
                    </div>
                    <div class="stat-item">
                        <label>Âge</label>
                        <value id="age">0</value>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-label">
                        <span>Progression du monde</span>
                        <span id="exp-text">0 / 100</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions-panel" id="actionsPanel">
            <button class="action-btn" data-action="water">
                <div class="action-tooltip">Arroser (15 EXP)</div>
                💧
            </button>
            <button class="action-btn" data-action="sunlight">
                <div class="action-tooltip">Ensoleiller (20 EXP)</div>
                ☀️
            </button>
            <button class="action-btn" data-action="fertilize">
                <div class="action-tooltip">Fertiliser (25 EXP)</div>
                🌱
            </button>
            <button class="action-btn" data-action="prune">
                <div class="action-tooltip">Tailler (18 EXP)</div>
                ✂️
            </button>
            <button class="action-btn" data-action="rake">
                <div class="action-tooltip">Ratisser (12 EXP)</div>
                🚀
            </button>
            <button class="action-btn" data-action="talk">
                <div class="action-tooltip">Parler (10 EXP)</div>
                💬
            </button>
            <button class="action-btn" data-action="heal">
                <div class="action-tooltip">Soigner (30 EXP)</div>
                🏥
            </button>
            <button class="action-btn" data-action="polish">
                <div class="action-tooltip">Nettoyer (15 EXP)</div>
                ✨
            </button>
        </div>

        <div class="effects-container" id="effectsContainer"></div>
        <div class="milestone-message" id="milestoneMessage"></div>
        
        <div class="world-complete-modal" id="worldCompleteModal">
            <div class="world-complete-content">
                <h1>🎉 Monde Complété!</h1>
                <p id="completeMessage">Félicitations! Tu as fait grandir ton arbre!</p>
                <button class="next-world-btn">Monde Suivant →</button>
            </div>
        </div>
    </div>

    <script>
        class WorldData {
            static worlds = [
                {
                    id: 0,
                    name: 'Les Débuts',
                    maxLevel: 6,
                    requiredExp: 100,
                    treeColor: '#2E7D32',
                    skyGradient: ['#87CEEB', '#E0F6FF'],
                    description: 'Cultive ton premier arbre simple et magnifique!',
                    requiredActions: {
                        water: { min: 3 },
                        sunlight: { min: 2 },
                        fertilize: { min: 2 }
                    }
                },
                {
                    id: 1,
                    name: 'La Forêt Enchantée',
                    maxLevel: 8,
                    requiredExp: 150,
                    treeColor: '#1B5E20',
                    skyGradient: ['#4A90E2', '#7B68EE'],
                    description: 'Un arbre mystérieux aux couleurs magiques!',
                    requiredActions: {
                        water: { min: 5 },
                        sunlight: { min: 5 },
                        fertilize: { min: 4 },
                        prune: { min: 2 }
                    }
                },
                {
                    id: 2,
                    name: 'Le Désert Ancien',
                    maxLevel: 10,
                    requiredExp: 200,
                    treeColor: '#FF9800',
                    skyGradient: ['#FFB347', '#FFDAB9'],
                    description: 'Un arbre robuste du désert face aux intempéries!',
                    requiredActions: {
                        water: { min: 10 },
                        sunlight: { min: 8 },
                        heal: { min: 5 },
                        polish: { min: 3 }
                    }
                },
                {
                    id: 3,
                    name: 'La Montagne Gelée',
                    maxLevel: 12,
                    requiredExp: 250,
                    treeColor: '#00BCD4',
                    skyGradient: ['#B0E0E6', '#E0FFFF'],
                    description: 'Un arbre majestueux face au froid extrême!',
                    requiredActions: {
                        fertilize: { min: 8 },
                        heal: { min: 8 },
                        talk: { min: 5 },
                        polish: { min: 5 }
                    }
                }
            ];

            static getWorld(id) {
                return this.worlds[Math.min(id, this.worlds.length - 1)];
            }
        }

        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            addWater(x, y) {
                for (let i = 0; i < 8; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * 3 + 2,
                        life: 1,
                        type: 'water',
                        size: Math.random() * 4 + 2
                    });
                }
            }

            addSun(x, y) {
                for (let i = 0; i < 12; i++) {
                    const angle = (Math.PI * 2 / 12) * i;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * 3,
                        vy: Math.sin(angle) * 3,
                        life: 1,
                        type: 'sun',
                        size: Math.random() * 3 + 1
                    });
                }
            }

            addLeaves(x, y) {
                for (let i = 0; i < 6; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * 2 - 1,
                        life: 1,
                        type: 'leaf',
                        size: Math.random() * 3 + 2
                    });
                }
            }

            addHearts(x, y) {
                for (let i = 0; i < 5; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -Math.random() * 3 - 1,
                        life: 1,
                        type: 'heart',
                        size: Math.random() * 2 + 1
                    });
                }
            }

            update() {
                this.particles = this.particles.filter(p => p.life > 0);
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.life -= 0.015;
                });
            }

            draw(ctx) {
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    
                    if (p.type === 'water') {
                        ctx.fillStyle = '#2196F3';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (p.type === 'sun') {
                        ctx.fillStyle = '#FFC107';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (p.type === 'leaf') {
                        ctx.fillStyle = '#4CAF50';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (p.type === 'heart') {
                        ctx.font = `${p.size * 10}px Arial`;
                        ctx.fillText('❤', p.x, p.y);
                    }
                    
                    ctx.restore();
                });
            }
        }

        class InteractiveTree {
            constructor() {
                this.canvas = document.getElementById('treeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.particleSystem = new ParticleSystem();
                
                this.worldId = 0;
                this.currentWorld = WorldData.getWorld(0);
                this.level = 1;
                this.exp = 0;
                this.maxExp = this.currentWorld.requiredExp;
                this.health = 100;
                this.age = 0;
                this.growth = 0.5;
                this.actionCooldowns = {};
                this.actionCount = {};
                
                this.setupCanvas();
                this.setupEventListeners();
                this.startGameLoop();
                this.loadGame();
            }

            setupCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                });
            }

            setupEventListeners() {
                document.querySelectorAll('.action-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const action = btn.dataset.action;
                        this.performAction(action, btn);
                    });
                });

                document.querySelector('.next-world-btn').addEventListener('click', () => {
                    this.nextWorld();
                });
            }

            performAction(action, button) {
                const now = Date.now();
                if (this.actionCooldowns[action] && now - this.actionCooldowns[action] < 400) return;
                
                this.actionCooldowns[action] = now;
                this.actionCount[action] = (this.actionCount[action] || 0) + 1;

                const expGains = {
                    water: 15, sunlight: 20, fertilize: 25, prune: 18,
                    rake: 12, talk: 10, heal: 30, polish: 15
                };

                const healthChanges = {
                    water: 10, sunlight: 8, fertilize: 12, prune: -5,
                    rake: 0, talk: 3, heal: 30, polish: 5
                };

                const growthBonus = {
                    water: 0.02, sunlight: 0.03, fertilize: 0.04, prune: 0.01,
                    rake: 0.005, talk: 0.005, heal: 0.02, polish: 0.01
                };

                const expGain = expGains[action] || 10;
                this.exp += expGain;
                this.health = Math.max(0, Math.min(100, this.health + healthChanges[action]));
                this.growth = Math.min(3, this.growth + growthBonus[action]);

                const treeX = this.canvas.width / 2;
                const treeY = this.canvas.height / 2;

                if (action === 'water') {
                    this.particleSystem.addWater(treeX, treeY);
                } else if (action === 'sunlight') {
                    this.particleSystem.addSun(treeX, treeY);
                } else if (action === 'fertilize') {
                    this.particleSystem.addLeaves(treeX, treeY);
                } else if (action === 'heal') {
                    this.particleSystem.addHearts(treeX, treeY);
                } else if (action === 'polish') {
                    this.particleSystem.addSun(treeX, treeY);
                }

                this.showFloatingText(expGain, treeX, treeY);
                
                if (this.exp >= this.maxExp) {
                    this.levelUp();
                }

                this.updateUI();
                this.checkWorldCompletion();
                this.saveGame();
            }

            levelUp() {
                this.level++;
                this.exp = 0;
                this.maxExp = Math.floor(this.maxExp * 1.1);
                this.health = Math.min(100, this.health + 20);
                this.showMilestoneMessage(`🎉 NIVEAU ${this.level}!`);
            }

            showFloatingText(amount, x, y) {
                const el = document.createElement('div');
                el.className = 'floating-text exp-gain';
                el.textContent = `+${amount} EXP`;
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                document.getElementById('effectsContainer').appendChild(el);
                setTimeout(() => el.remove(), 2000);
            }

            showMilestoneMessage(text) {
                const el = document.getElementById('milestoneMessage');
                el.textContent = text;
                el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 3000);
            }

            checkWorldCompletion() {
                const world = this.currentWorld;
                const requiredLevel = world.maxLevel;

                if (this.level >= requiredLevel) {
                    let allConditionsMet = true;
                    
                    for (const [action, requirement] of Object.entries(world.requiredActions)) {
                        if ((this.actionCount[action] || 0) < requirement.min) {
                            allConditionsMet = false;
                            break;
                        }
                    }

                    if (allConditionsMet) {
                        this.completeWorld();
                    }
                }
            }

            completeWorld() {
                const modal = document.getElementById('worldCompleteModal');
                const message = document.getElementById('completeMessage');
                
                message.textContent = `Bravo! Tu as complété le monde "${this.currentWorld.name}"! Passe au monde suivant!`;
                modal.classList.add('show');
            }

            nextWorld() {
                this.worldId++;
                if (this.worldId >= WorldData.worlds.length) {
                    this.worldId = WorldData.worlds.length - 1;
                }
                
                this.currentWorld = WorldData.getWorld(this.worldId);
                this.level = 1;
                this.exp = 0;
                this.maxExp = this.currentWorld.requiredExp;
                this.health = 100;
                this.growth = 0.5;
                this.actionCount = {};
                
                document.getElementById('worldCompleteModal').classList.remove('show');
                document.getElementById('worldTitle').textContent = `Monde ${this.worldId + 1}: ${this.currentWorld.name}`;
                
                this.updateUI();
                this.saveGame();
            }

            updateUI() {
                document.getElementById('level').textContent = this.level;
                document.getElementById('exp').textContent = this.exp;
                document.getElementById('health').textContent = Math.round(this.health) + '%';
                document.getElementById('age').textContent = Math.floor(this.age);

                const progress = (this.exp / this.maxExp) * 100;
                document.getElementById('progress-fill').style.width = progress + '%';
                document.getElementById('exp-text').textContent = `${this.exp} / ${this.maxExp}`;
            }

            startGameLoop() {
                const animate = () => {
                    this.age += 0.016;
                    this.particleSystem.update();
                    this.draw();
                    requestAnimationFrame(animate);
                };
                animate();
            }

            draw() {
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, this.currentWorld.skyGradient[0]);
                gradient.addColorStop(1, this.currentWorld.skyGradient[1]);
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.drawClouds();

                this.ctx.fillStyle = '#8B7355';
                this.ctx.fillRect(0, this.canvas.height - 60, this.canvas.width, 60);
                this.ctx.fillStyle = '#A0826D';
                this.ctx.fillRect(0, this.canvas.height - 40, this.canvas.width, 40);

                this.ctx.fillStyle = '#4CAF50';
                for (let i = 0; i < this.canvas.width; i += 40) {
                    this.ctx.fillRect(i + Math.sin(this.age * 0.5 + i) * 5, this.canvas.height - 50, 30, 20);
                }

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height - 100;
                this.drawTree(centerX, centerY);

                this.drawHealthBar(centerX, centerY - 150);

                this.particleSystem.draw(this.ctx);

                if (this.health < 30) {
                    this.ctx.fillStyle = 'rgba(255, 0, 0, 0.05)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }

            drawClouds() {
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                for (let i = 0; i < 3; i++) {
                    const x = (this.age * 20 + i * 400) % (this.canvas.width + 200) - 100;
                    const y = 80 + i * 60;
                    this.drawCloud(x, y, 60);
                }
            }

            drawCloud(x, y, size) {
                this.ctx.beginPath();
                this.ctx.arc(x, y, size, 0, Math.PI * 2);
                this.ctx.arc(x + size * 1.2, y, size * 0.8, 0, Math.PI * 2);
                this.ctx.arc(x + size * 2.4, y, size, 0, Math.PI * 2);
                this.ctx.fill();
            }

            drawTree(x, y) {
                const size = this.growth * 40;

                this.ctx.fillStyle = '#5D4037';
                const trunkWidth = Math.min(30, 15 + this.growth * 8);
                const trunkHeight = Math.min(200, 80 + this.growth * 50);
                this.ctx.fillRect(x - trunkWidth / 2, y - trunkHeight, trunkWidth, trunkHeight);

                this.ctx.strokeStyle = '#3E2723';
                this.ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const ringY = y - (trunkHeight * (i / 5));
                    this.ctx.beginPath();
                    this.ctx.arc(x, ringY, trunkWidth / 2 + 2, 0, Math.PI * 2);
                    this.ctx.stroke();
                }

                this.drawBranches(x, y - trunkHeight, size);

                const foliageSize = size * 2.2;
                const leafColor = this.currentWorld.treeColor;
                
                this.ctx.fillStyle = leafColor;
                this.ctx.globalAlpha = 0.85;

                this.ctx.beginPath();
                this.ctx.arc(x, y - trunkHeight - foliageSize * 0.6, foliageSize, 0, Math.PI * 2);
                this.ctx.fill();

                const branchCount = Math.min(6, Math.floor(this.growth * 4));
                for (let i = 0; i < branchCount; i++) {
                    const angle = (Math.PI * 2 / branchCount) * i;
                    const branchX = x + Math.cos(angle) * foliageSize * 0.7;
                    const branchY = y - trunkHeight - foliageSize * 0.4;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(branchX, branchY, foliageSize * 0.7, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                if (this.level > 3) {
                    this.ctx.globalAlpha = 1;
                    const flowerCount = Math.floor(this.growth * 3);
                    for (let i = 0; i < flowerCount; i++) {
                        const angle = (Math.PI * 2 / flowerCount) * i;
                        const flowerX = x + Math.cos(angle) * foliageSize * 0.8;
                        const flowerY = y - trunkHeight - foliageSize * 0.5;
                        
                        this.ctx.fillStyle = this.level > 8 ? '#FF69B4' : '#FFD700';
                        this.ctx.beginPath();
                        this.ctx.arc(flowerX, flowerY, 8, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }

                this.ctx.globalAlpha = 1;
            }

            drawBranches(x, y, size) {
                this.ctx.strokeStyle = '#6D4C41';
                this.ctx.lineWidth = 4 + this.growth * 2;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';

                const branchCount = Math.min(8, Math.floor(3 + this.growth * 3));
                
                for (let i = 0; i < branchCount; i++) {
                    const angle = (Math.PI / branchCount) * i + Math.PI / 4;
                    const length = 50 + this.growth * 40;
                    
                    const endX = x + Math.cos(angle) * length;
                    const endY = y - Math.sin(angle) * length;

                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y);
                    this.ctx.lineTo(endX, endY);
                    this.ctx.stroke();
                }
            }

            drawHealthBar(x, y) {
                const barWidth = 120;
                const barHeight = 15;
                const healthPercent = this.health / 100;

                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                this.ctx.fillRect(x - barWidth / 2, y, barWidth, barHeight);

                const healthColor = healthPercent > 0.7 ? '#4CAF50' : 
                                   healthPercent > 0.4 ? '#FFC107' : '#F44336';
                this.ctx.fillStyle = healthColor;
                this.ctx.fillRect(x - barWidth / 2, y, barWidth * healthPercent, barHeight);

                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(x - barWidth / 2, y, barWidth, barHeight);
            }

            saveGame() {
                const gameState = {
                    worldId: this.worldId,
                    level: this.level,
                    exp: this.exp,
                    maxExp: this.maxExp,
                    health: this.health,
                    age: this.age,
                    growth: this.growth,
                    actionCount: this.actionCount
                };
                localStorage.setItem('treeGameState', JSON.stringify(gameState));
            }

            loadGame() {
                const saved = localStorage.getItem('treeGameState');
                if (saved) {
                    const state = JSON.parse(saved);
                    this.worldId = state.worldId || 0;
                    this.currentWorld = WorldData.getWorld(this.worldId);
                    this.level = state.level;
                    this.exp = state.exp;
                    this.maxExp = state.maxExp;
                    this.health = state.health;
                    this.age = state.age;
                    this.growth = state.growth;
                    this.actionCount = state.actionCount || {};
                    
                    document.getElementById('worldTitle').textContent = `Monde ${this.worldId + 1}: ${this.currentWorld.name}`;
                    this.updateUI();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new InteractiveTree();
        });
    </script>
</body>
</html>
