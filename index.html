<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Horloge & XP — Mini site</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
  :root{
    --bg:#0f1724;
    --card: rgba(255,255,255,0.06);
    --accent: #7c5cff;
    --accent-2: #00d4ff;
    --glass: rgba(255,255,255,0.04);
    --text: #e6eef8;
    --accent-3: #ffd166;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  body{
    background: radial-gradient(1200px 600px at 10% 10%, rgba(124,92,255,0.12), transparent),
                radial-gradient(900px 400px at 90% 90%, rgba(0,212,255,0.06), transparent),
                var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .app{
    width:100%;
    max-width:980px;
    min-height:640px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:16px;
    padding:28px;
    position:relative;
    box-shadow: 0 10px 40px rgba(2,6,23,0.6);
    overflow:hidden;
  }

  /* Weather button top-left (toujours présent mais pas nécessaire) */
  .weather-btn{
    position:absolute;
    top:18px;
    left:18px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border:none;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(124,92,255,0.18);
    z-index:40;
  }

  .top{
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
    gap:12px;
  }

  /* Level card */
  .level-card{
    width:260px;
    background:var(--card);
    border-radius:12px;
    padding:12px;
    backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.03);
  }
  .level-info{display:flex;flex-direction:column;gap:6px}
  #levelText{font-weight:700;font-size:18px;letter-spacing:0.4px}
  #xpText{font-size:13px;color:rgba(230,238,248,0.8)}

  /* XP bar */
  .xp-bar{height:12px;background:rgba(255,255,255,0.04);border-radius:8px;margin-top:10px;overflow:hidden}
  .xp-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width 800ms cubic-bezier(.2,.9,.3,1);
  }

  /* Main clock */
  .main{display:flex;align-items:center;justify-content:center;height:calc(100% - 220px)}
  .clock-card{
    text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    padding:36px 48px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.03);
    box-shadow: 0 6px 30px rgba(2,6,23,0.45);
    min-width:420px;
  }
  .time{
    font-size:72px;
    font-weight:800;
    letter-spacing:1px;
    color:transparent;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-fill-color:transparent;
  }
  .date{
    margin-top:8px;
    color:rgba(230,238,248,0.85);
    font-weight:500;
  }

  /* Weather panel (toujours visible au chargement) */
  .weather-panel{
    position:absolute;
    top:18px;
    left:18px;
    width:320px;
    max-width:calc(100% - 40px);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:12px;
    padding:16px;
    border:1px solid rgba(255,255,255,0.04);
    box-shadow:0 18px 40px rgba(2,6,23,0.55);
    z-index:30;
  }
  .weather-panel h3{margin:0 0 8px 0}
  .close{position:absolute;right:8px;top:8px;border:none;background:none;color:var(--text);font-size:16px;cursor:pointer}
  .weather-content p{margin:12px 0;color:rgba(230,238,248,0.9)}
  .weather-row{display:flex;align-items:center;gap:12px}
  .weather-temp{font-size:36px;font-weight:700}
  .weather-desc{font-weight:500;color:rgba(230,238,248,0.85)}
  .location-name{font-size:13px;color:rgba(230,238,248,0.75);margin-bottom:8px}

  /* Trophy panel (top-right under level card) */
  .trophy-panel{
    width:220px;
    background:var(--card);
    border-radius:12px;
    padding:12px;
    backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.03);
    margin-top:6px;
  }
  .trophy-panel h4{margin:0 0 8px 0;font-size:14px}
  .trophy-list{display:flex;flex-direction:column;gap:8px}
  .trophy{display:flex;gap:8px;align-items:center;padding:6px;border-radius:8px;background:rgba(255,255,255,0.01)}
  .trophy.locked{opacity:0.45;filter:grayscale(40%)}
  .trophy .icon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;font-weight:700}
  .trophy .meta{font-size:13px}
  .trophy .meta .name{font-weight:700}
  .trophy .meta .req{font-size:12px;color:rgba(230,238,248,0.65)}

  /* Footer */
  .footer{position:absolute;bottom:18px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center}
  .controls button{margin-right:8px;padding:8px 12px;border-radius:8px;border:none;background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer}
  .credit{font-size:13px;color:rgba(230,238,248,0.65)}

  /* small animations */
  #levelCard.flash { box-shadow: 0 0 0 6px rgba(124,92,255,0.12), 0 12px 30px rgba(2,6,23,0.6); transform:translateY(-6px); transition:transform .25s ease; }
  #levelCard { transition: transform .2s ease, box-shadow .3s ease; }

  @media (max-width:900px){
    .app{padding:18px}
    .trophy-panel{display:none}
    .weather-panel{position:relative;left:unset;top:unset;margin-bottom:12px}
  }
  </style>
</head>
<body>
  <div class="app">
    <button id="weather-btn" class="weather-btn" aria-expanded="true" title="Météo (automatique)">
      ☀️ Météo
    </button>

    <header class="top" style="gap:12px;">
      <div class="level-card" id="levelCard" role="status" aria-live="polite">
        <div class="level-info">
          <div id="levelText">Niveau 1</div>
          <div id="xpText">XP: 0 / 100</div>
        </div>
        <div class="xp-bar" aria-hidden="true">
          <div id="xpFill" class="xp-fill"></div>
        </div>
      </div>

      <div class="trophy-panel" id="trophyPanel" aria-live="polite">
        <h4>Trophées</h4>
        <div class="trophy-list" id="trophyList">
          <!-- list dynamique -->
        </div>
      </div>
    </header>

    <main class="main">
      <div class="clock-card">
        <div id="time" class="time">--:--:--</div>
        <div id="date" class="date">--</div>
      </div>
    </main>

    <aside id="weatherPanel" class="weather-panel" aria-hidden="false">
      <button id="closeWeather" class="close" aria-label="Fermer panneau météo">✕</button>
      <h3>Météo locale</h3>
      <div id="locationName" class="location-name" aria-hidden="true"></div>
      <div id="weatherContent" class="weather-content">
        <p>Chargement météo...</p>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button id="forceLocation">Rafraîchir</button>
        <button id="fallbackCity">Entrer une ville</button>
      </div>
    </aside>

    <footer class="footer">
      <div class="controls">
        <button id="addXP">+ XP (test +25)</button>
        <button id="resetXP">Réinitialiser</button>
      </div>
      <div class="credit">Fait pour le kiffe — Horloge & XP</div>
    </footer>
  </div>

  <script>
  // Config XP
  const XP_PER_MINUTE = 10;     // +10 toutes les minutes
  const HOURLY_BONUS = 400;     // bonus chaque heure complète => 1h = 60*10 + 400 = 1000
  const STORAGE_KEY = "mini_clock_xp_v2";

  function xpToNextLevel(level){
    return Math.floor(100 * Math.pow(1.5, level-1));
  }

  // State stocké
  let state = {
    xp: 0,         // current XP in level
    level: 1,
    totalXP: 0     // cumul de tous les XP gagnés (pour trophées)
  };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(typeof parsed.xp === "number" && typeof parsed.level === "number" && typeof parsed.totalXP === "number"){
          state = parsed;
        }
      }
    }catch(e){ console.warn("loadState:", e) }
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn("saveState:", e) }
  }

  // Clock
  const timeEl = document.getElementById("time");
  const dateEl = document.getElementById("date");
  function pad(n){ return n < 10 ? "0"+n : n; }
  function updateClock(){
    const now = new Date();
    timeEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    dateEl.textContent = now.toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});
  }
  updateClock();
  setInterval(updateClock, 1000);

  // XP UI
  const levelText = document.getElementById("levelText");
  const xpText = document.getElementById("xpText");
  const xpFill = document.getElementById("xpFill");
  const levelCardEl = document.getElementById("levelCard");

  function renderXP(){
    const next = xpToNextLevel(state.level);
    const pct = Math.min(100, Math.round(100 * state.xp / next));
    levelText.textContent = `Niveau ${state.level}`;
    xpText.textContent = `XP: ${state.xp} / ${next}`;
    xpFill.style.width = pct + "%";
  }

  function addXP(amount, reason){
    // amount est ajouté au total et au xp courant (niveau)
    if(typeof amount !== "number" || amount <= 0) return;
    state.totalXP += amount;
    state.xp += amount;

    // level up loop
    while(state.xp >= xpToNextLevel(state.level)){
      state.xp -= xpToNextLevel(state.level);
      state.level++;
      flashLevel();
    }
    saveState();
    renderXP();
    checkTrophies(); // vérifie déblocage
    if(reason) showToast(`+${amount} XP (${reason})`);
  }

  function flashLevel(){
    levelCardEl.classList.add("flash");
    setTimeout(()=>levelCardEl.classList.remove("flash"), 900);
  }

  // Toast simple
  function showToast(text){
    const t = document.createElement("div");
    t.textContent = text;
    t.style.position = "fixed";
    t.style.right = "18px";
    t.style.bottom = "18px";
    t.style.padding = "10px 14px";
    t.style.background = "linear-gradient(90deg,var(--accent),var(--accent-2))";
    t.style.color = "white";
    t.style.borderRadius = "10px";
    t.style.boxShadow = "0 8px 30px rgba(2,6,23,0.6)";
    t.style.zIndex = 9999;
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.opacity = '0'; t.style.transform='translateY(8px)'; }, 2200);
    setTimeout(()=>t.remove(), 3000);
  }

  loadState();
  renderXP();

  // scheduling aligned to the start of next minute for better timing
  function scheduleXP(){
    const now = new Date();
    const msToNextMinute = (60 - now.getSeconds())*1000 - now.getMilliseconds() + 50; // slight offset
    setTimeout(()=> {
      // first tick at start of next minute
      minuteTick();
      // then every 60s
      setInterval(minuteTick, 60_000);
    }, msToNextMinute);
  }

  function minuteTick(){
    // add +10 for the minute
    addXP(XP_PER_MINUTE, "minute écoulée");
    // if start of hour (minute == 0), add hourly bonus
    const now = new Date();
    if(now.getMinutes() === 0){
      addXP(HOURLY_BONUS, "bonus horaire");
    }
  }

  scheduleXP();

  // Controls
  document.getElementById("addXP").addEventListener("click", ()=> addXP(25, "test manuel"));
  document.getElementById("resetXP").addEventListener("click", ()=>{
    if(confirm("Réinitialiser l'XP, niveau et trophées ?")){
      state = {xp:0, level:1, totalXP:0};
      saveState();
      renderXP();
      resetTrophies();
    }
  });

  /* ===========================
     Trophées / Achievements
     =========================== */

  const trophyDefs = [
    { id: "novice", name: "Novice", desc: "Atteins 100 XP", req: 100, emoji: "🌱" },
    { id: "apprenti", name: "Apprenti", desc: "Atteins 1 000 XP", req: 1000, emoji: "🏅" },
    { id: "heureux", name: "Heureux", desc: "Atteins 1 heure de jeu (1 000 XP)", req: 1000, emoji: "⏱️" },
    { id: "veteran", name: "Vétéran", desc: "Atteins 10 000 XP", req: 10000, emoji: "🥈" },
    { id: "insomnia", name: "Insomnia", desc: "12 heures = 12 000 XP (easter egg)", req: 12000, emoji: "🌙" },
    { id: "collector", name: "Collectionneur", desc: "Atteins 50 000 XP", req: 50000, emoji: "🏆" }
  ];

  let trophies = {}; // id -> unlocked boolean

  function loadTrophies(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY + "_trophies");
      if(raw) trophies = JSON.parse(raw);
    }catch(e){ trophies = {}; }
  }
  function saveTrophies(){
    try{ localStorage.setItem(STORAGE_KEY + "_trophies", JSON.stringify(trophies)); }
    catch(e){ console.warn("saveTrophies:", e) }
  }
  function resetTrophies(){
    trophies = {};
    saveTrophies();
    renderTrophies();
  }

  function checkTrophies(){
    loadTrophies();
    let changed = false;
    for(const t of trophyDefs){
      if(!trophies[t.id] && state.totalXP >= t.req){
        trophies[t.id] = { unlockedAt: Date.now() };
        changed = true;
        showToast(`Trophée débloqué : ${t.name} ${t.emoji}`);
      }
    }
    if(changed) saveTrophies();
    renderTrophies();
  }

  // Render trophy UI
  const trophyListEl = document.getElementById("trophyList");
  function renderTrophies(){
    loadTrophies();
    trophyListEl.innerHTML = "";
    for(const t of trophyDefs){
      const unlocked = !!trophies[t.id];
      const tr = document.createElement("div");
      tr.className = "trophy" + (unlocked ? "" : " locked");
      tr.innerHTML = `<div class="icon">${t.emoji}</div>
                      <div class="meta"><div class="name">${t.name}</div><div class="req">${t.desc} • ${t.req.toLocaleString()} XP</div></div>`;
      trophyListEl.appendChild(tr);
    }
  }

  loadTrophies();
  renderTrophies();
  checkTrophies();

  /* ===========================
     Météo (auto au chargement)
     =========================== */

  const weatherBtn = document.getElementById("weather-btn");
  const weatherPanel = document.getElementById("weatherPanel");
  const weatherContent = document.getElementById("weatherContent");
  const closeWeather = document.getElementById("closeWeather");
  const forceLocation = document.getElementById("forceLocation");
  const fallbackCity = document.getElementById("fallbackCity");
  const locationNameEl = document.getElementById("locationName");

  const DEFAULT_CITY = { latitude: 48.8566, longitude: 2.3522, pretty: "Paris, France (fallback)" };

  weatherBtn.addEventListener("click", async ()=>{
    // toggle? but we keep visible by default; here we refresh
    await showWeather({force:true});
  });

  closeWeather.addEventListener("click", ()=> {
    // Hide panel if the user wants
    weatherPanel.style.display = 'none';
  });
  forceLocation.addEventListener("click", async ()=> await showWeather({force:true}));
  fallbackCity.addEventListener("click", async ()=>{
    const city = prompt("Entrez le nom d'une ville (ex: Paris) :");
    if(city) await fetchWeatherByCity(city);
  });

  // Auto-open and fetch weather on load
  (async function initWeather(){
    weatherPanel.style.display = 'block'; // always visible by default
    await showWeather();
  })();

  // showWeather tries geolocation, else fallback to DEFAULT_CITY
  async function showWeather(opts = {}){
    const { force=false } = opts;
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Récupération de la position...</p>";

    let used = null;

    if(navigator.geolocation && !force){
      // try quick geolocation (user may deny)
      try{
        const pos = await new Promise((resolve, reject) => {
          const id = navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:8000});
        });
        used = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
      }catch(err){
        console.warn("Geoloc failed:", err);
        // don't throw — we'll fallback to DEFAULT_CITY
      }
    }

    // if not obtained, try IP geolocation but if it points to Amiens (postal 80000), we ignore and use Paris fallback
    if(!used){
      try{
        const res = await fetch('https://ipapi.co/json/');
        if(res.ok){
          const ip = await res.json();
          if(ip && typeof ip.latitude !== 'undefined' && typeof ip.longitude !== 'undefined'){
            // If ip.city contains 'Amiens' or postal is 80000, we override and use DEFAULT_CITY
            const cityLower = (ip.city || "").toLowerCase();
            const postal = ip.postal || "";
            if(cityLower.includes("amiens") || postal.startsWith("80")){
              used = { latitude: DEFAULT_CITY.latitude, longitude: DEFAULT_CITY.longitude, note: "fallback to Paris (override Amiens)" };
            } else {
              used = { latitude: ip.latitude, longitude: ip.longitude, pretty: (ip.city ? ip.city + (ip.region ? ", "+ip.region : "") + (ip.country_name ? ", " + ip.country_name : "") : null) };
            }
          }
        }
      }catch(e){
        console.warn("IP lookup failed:", e);
      }
    }

    if(!used){
      // last resort: Paris fallback
      used = { latitude: DEFAULT_CITY.latitude, longitude: DEFAULT_CITY.longitude, pretty: DEFAULT_CITY.pretty };
    }

    await fetchWeather(used.latitude, used.longitude, used.pretty || null, used.note || null);
  }

  async function fetchWeather(lat, lon, knownLocationName = null, note = null){
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Chargement météo...</p>";
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      const cw = data.current_weather;
      if(!cw){
        weatherContent.innerHTML = "<p>Météo indisponible.</p>";
        return;
      }

      // reverse geocoding to pretty name if not provided
      if(!knownLocationName){
        try{
          const revUrl = `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1&language=fr`;
          const rres = await fetch(revUrl);
          if(rres.ok){
            const rdata = await rres.json();
            if(rdata.results && rdata.results.length > 0){
              const r = rdata.results[0];
              knownLocationName = `${r.name}${r.admin1 ? ', '+r.admin1 : ''}${r.country ? ', '+r.country : ''}${r.postal_code ? ' ('+r.postal_code+')' : ''}`;
            }
          }
        }catch(e){ /* ignore */ }
      }

      if(knownLocationName) {
        locationNameEl.textContent = knownLocationName + (note ? " • " + note : "");
        locationNameEl.setAttribute('aria-hidden','false');
      } else {
        locationNameEl.textContent = note || "";
        locationNameEl.setAttribute('aria-hidden', knownLocationName ? 'false' : 'true');
      }

      const temp = cw.temperature;
      const wind = cw.windspeed;
      const code = cw.weathercode;
      const desc = weatherCodeToText(code);
      weatherContent.innerHTML = `
        <div class="weather-row" style="align-items:flex-start;">
          <div>
            <div class="weather-temp">${Math.round(temp)}°C</div>
            <div class="weather-desc">${desc}</div>
          </div>
        </div>
        <p>Vitesse du vent : ${wind} km/h</p>
        <p>Rafraîchis: ${new Date().toLocaleTimeString()}</p>
      `;
    }catch(e){
      weatherContent.innerHTML = `<p>Erreur météo: ${e.message}</p>`;
    }
  }

  async function fetchWeatherByCity(city){
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Recherche de la ville...</p>";
    try{
      const gurl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr`;
      const gres = await fetch(gurl);
      if(!gres.ok) throw new Error(gres.statusText);
      const gdata = await gres.json();
      if(!gdata.results || gdata.results.length === 0){
        weatherContent.innerHTML = `<p>Ville introuvable: ${city}</p>`;
        return;
      }
      const r = gdata.results[0];
      const pretty = `${r.name}${r.admin1 ? ', '+r.admin1 : ''}${r.country ? ', '+r.country : ''}${r.postal_code ? ' ('+r.postal_code+')' : ''}`;
      await fetchWeather(r.latitude, r.longitude, pretty);
    }catch(e){
      weatherContent.innerHTML = `<p>Erreur géocodage: ${e.message}</p>`;
    }
  }

  function weatherCodeToText(code){
    const map = {
      0: "Ciel clair",1:"Principalement ensoleillé",2:"Partiellement nuageux",3:"Couvert",
      45:"Brouillard",48:"Brouillard givrant",51:"Bruine légère",53:"Bruine modérée",55:"Bruine dense",
      56:"Bruine verglaçante",57:"Bruine verglaçante dense",61:"Pluie légère",63:"Pluie modérée",65:"Pluie forte",
      66:"Pluie verglaçante légère",67:"Pluie verglaçante forte",71:"Neige légère",73:"Neige modérée",75:"Neige forte",
      77:"Grains de neige",80:"Averses légères",81:"Averses modérées",82:"Averses violentes",85:"Averses de neige légères",
      86:"Averses de neige fortes",95:"Orage",96:"Orage avec grêle légère",99:"Orage avec grêle forte"
    };
    return map[code] || "Temps inconnu";
  }

  // Affichage / initial checks
  checkTrophies();

  // Petit rappel pour l'utilisateur sur la correspondance 12h -> points
  console.log("Info: 1 minute = +10 XP, 10 minutes = 100 XP, 1 heure = 1000 XP. Donc 12h = 12 000 XP.");

  // Fin du script
  </script>
</body>
</html>
