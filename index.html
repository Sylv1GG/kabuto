<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Horloge & XP — Mini site</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
  :root{
    --bg:#0f1724;
    --card: rgba(255,255,255,0.06);
    --accent: #7c5cff;
    --accent-2: #00d4ff;
    --text: #e6eef8;
    --muted: rgba(230,238,248,0.65);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  body{
    background: radial-gradient(1200px 600px at 10% 10%, rgba(124,92,255,0.12), transparent),
                radial-gradient(900px 400px at 90% 90%, rgba(0,212,255,0.06), transparent),
                var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* App container with room around center */
  .app{
    width:100%;
    max-width:1000px;
    min-height:720px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:16px;
    padding:24px;
    position:relative;
    box-shadow: 0 10px 40px rgba(2,6,23,0.6);
    overflow:hidden;
    display:grid;
    grid-template-columns: 320px 1fr 260px;
    grid-template-rows: 160px 1fr 120px;
    gap:16px;
  }

  /* Weather (top-left) */
  .weather-panel{
    grid-column: 1 / 2;
    grid-row: 1 / 3;
    align-self:start;
    width:100%;
    background:var(--card);
    border-radius:12px;
    padding:12px;
    border:1px solid rgba(255,255,255,0.03);
    box-shadow:0 8px 30px rgba(2,6,23,0.45);
    overflow:hidden;
  }
  .weather-panel h3{margin:0 0 8px 0;font-size:16px}
  .location-name{font-size:13px;color:var(--muted);margin-bottom:6px}
  .weather-temp{font-size:36px;font-weight:700}
  .weather-desc{font-weight:500;color:var(--muted)}
  .weather-actions{margin-top:12px;display:flex;gap:8px}

  /* Level card (top-right area) */
  .level-card{
    grid-column: 3 / 4;
    grid-row: 1 / 2;
    background:var(--card);
    border-radius:12px;
    padding:12px;
    border:1px solid rgba(255,255,255,0.03);
    box-shadow:0 8px 30px rgba(2,6,23,0.2);
  }
  #levelText{font-weight:700;font-size:18px}
  #xpText{font-size:13px;color:var(--muted)}
  #totalXPText{font-size:12px;color:var(--muted);margin-top:6px}
  .xp-bar{height:12px;background:rgba(255,255,255,0.03);border-radius:8px;margin-top:10px;overflow:hidden}
  .xp-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .8s}

  /* Trophy panel (under level card) */
  .trophy-panel{
    grid-column: 3 / 4;
    grid-row: 2 / 3;
    background:var(--card);
    border-radius:12px;
    padding:12px;
    border:1px solid rgba(255,255,255,0.03);
    overflow:auto;
    max-height:420px;
  }
  .trophy-list{display:flex;flex-direction:column;gap:8px}
  .trophy{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;background:rgba(255,255,255,0.01)}
  .trophy.locked{opacity:0.45;filter:grayscale(40%)}
  .trophy .icon{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;font-weight:700}
  .trophy .meta .name{font-weight:700}
  .trophy .meta .req{font-size:12px;color:var(--muted)}

  /* Clock in center (only the time) */
  .clock-card{
    grid-column: 2 / 3;
    grid-row: 1 / 4;
    align-self:center;
    justify-self:center;
    width:420px;
    height:360px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:16px;
    padding:36px 24px;
    border:1px solid rgba(255,255,255,0.03);
    box-shadow: 0 12px 40px rgba(2,6,23,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .time{
    font-size:96px;
    font-weight:800;
    line-height:1;
    color:transparent;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-fill-color:transparent;
    user-select:none;
    cursor:pointer;
  }

  /* Bottom area (controls) */
  .bottom-controls{
    grid-column: 1 / 4;
    grid-row: 3 / 4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .controls{display:flex;gap:8px}
  .controls button{padding:8px 12px;border-radius:8px;border:none;background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer}

  /* Toast & confetti */
  .toast{position:fixed;right:18px;bottom:18px;padding:10px 14px;border-radius:10px;color:#fff;z-index:9999;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
  .confetti{position:fixed;left:50%;top:30%;width:10px;height:10px;border-radius:2px;opacity:0.95;z-index:9998;pointer-events:none;animation: confetti-fall 1200ms linear forwards}
  @keyframes confetti-fall {0% { transform: translate3d(0,0,0) rotate(0deg); opacity:1; } 100% { transform: translate3d(var(--dx, 0px), 700px, 0) rotate(720deg); opacity:0; }}

  @media (max-width:900px){
    .app{grid-template-columns: 1fr;grid-template-rows: auto auto 1fr auto;gap:12px}
    .weather-panel{grid-column:1/2;grid-row:1/2}
    .level-card{grid-column:1/2;grid-row:2/3}
    .trophy-panel{grid-column:1/2;grid-row:3/4}
    .clock-card{grid-column:1/2;grid-row:4/5;width:100%;height:260px}
    .bottom-controls{grid-column:1/2;grid-row:5/6}
  }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- Weather -->
    <aside class="weather-panel" id="weatherPanel" aria-hidden="false">
      <h3>Météo locale</h3>
      <div id="locationName" class="location-name">...</div>
      <div id="weatherContent">
        <p>Chargement...</p>
      </div>
      <div class="weather-actions">
        <button id="forceLocation">Rafraîchir</button>
        <button id="fallbackCity">Entrer une ville</button>
      </div>
    </aside>

    <!-- Center clock -->
    <main class="clock-card" id="clockCard">
      <div id="time" class="time">--:--:--</div>
    </main>

    <!-- Level (top-right) -->
    <div class="level-card" id="levelCard" role="status" aria-live="polite">
      <div id="levelText">Niveau 1</div>
      <div id="xpText">XP: 0 / 100</div>
      <div id="totalXPText">Total XP : 0</div>
      <div class="xp-bar" aria-hidden="true" style="margin-top:10px">
        <div id="xpFill" class="xp-fill"></div>
      </div>
    </div>

    <!-- Trophies (under level) -->
    <div class="trophy-panel" id="trophyPanel" aria-live="polite">
      <h4>Trophées</h4>
      <div class="trophy-list" id="trophyList"></div>
    </div>

    <!-- Bottom controls -->
    <div class="bottom-controls">
      <div class="controls">
        <button id="addXP">+ XP (test +25)</button>
        <button id="resetXP">Réinitialiser</button>
      </div>
      <div style="color:var(--muted);font-size:13px">Info rapide : 1 min = 10 XP • 10 min = 100 XP • 1 h = 1000 XP • 12 h = 12 000 XP</div>
    </div>
  </div>

  <script>
  // Config XP
  const XP_PER_MINUTE = 10;     // +10 toutes les minutes
  const HOURLY_BONUS = 400;     // bonus chaque heure complète => 1h = 60*10 + 400 = 1000
  const STORAGE_KEY = "mini_clock_xp_v4";

  function xpToNextLevel(level){
    return Math.floor(100 * Math.pow(1.5, level-1));
  }

  // State stocké
  let state = { xp:0, level:1, totalXP:0 };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(typeof parsed.xp==='number' && typeof parsed.level==='number' && typeof parsed.totalXP==='number'){
          state = parsed;
        }
      }
    }catch(e){ console.warn("loadState:", e) }
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){ console.warn(e) } }

  // Clock
  const timeEl = document.getElementById("time");
  function pad(n){ return n < 10 ? "0"+n : n; }
  function updateClock(){
    const now = new Date();
    timeEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  loadState();
  updateClock();
  setInterval(updateClock, 1000);

  // XP UI
  const levelText = document.getElementById("levelText");
  const xpText = document.getElementById("xpText");
  const totalXPText = document.getElementById("totalXPText");
  const xpFill = document.getElementById("xpFill");
  const levelCardEl = document.getElementById("levelCard");

  function renderXP(){
    const next = xpToNextLevel(state.level);
    const pct = Math.min(100, Math.round(100 * state.xp / next));
    levelText.textContent = `Niveau ${state.level}`;
    xpText.textContent = `XP: ${state.xp} / ${next}`;
    totalXPText.textContent = `Total XP : ${state.totalXP.toLocaleString()}`;
    xpFill.style.width = pct + "%";
  }

  function addXP(amount, reason){
    if(typeof amount !== "number" || amount <= 0) return;
    state.totalXP += amount;
    state.xp += amount;
    while(state.xp >= xpToNextLevel(state.level)){
      state.xp -= xpToNextLevel(state.level);
      state.level++;
      flashLevel();
    }
    saveState();
    renderXP();
    checkTrophies();
    if(reason) showToast(`+${amount} XP — ${reason}`);
  }

  function flashLevel(){
    levelCardEl.classList.add("flash");
    setTimeout(()=>levelCardEl.classList.remove("flash"), 900);
  }

  // Toast
  function showToast(text, color){
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = text;
    t.style.background = color || "linear-gradient(90deg,var(--accent),var(--accent-2))";
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.opacity = '0'; t.style.transform='translateY(8px)'; }, 2400);
    setTimeout(()=>t.remove(), 3000);
  }

  renderXP();

  // schedule XP aligned to minute
  function scheduleXP(){
    const now = new Date();
    const msToNextMinute = (60 - now.getSeconds())*1000 - now.getMilliseconds() + 50;
    setTimeout(()=> {
      minuteTick();
      setInterval(minuteTick, 60_000);
    }, msToNextMinute);
  }
  function minuteTick(){
    addXP(XP_PER_MINUTE, "minute écoulée");
    const now = new Date();
    if(now.getMinutes() === 0) addXP(HOURLY_BONUS, "bonus horaire");
  }
  scheduleXP();

  // Controls
  document.getElementById("addXP").addEventListener("click", ()=> addXP(25, "test manuel"));
  document.getElementById("resetXP").addEventListener("click", ()=>{
    if(confirm("Réinitialiser l'XP, niveau et trophées ?")){
      state = {xp:0, level:1, totalXP:0};
      saveState();
      renderXP();
      resetTrophies();
      showToast("Réinitialisé", "linear-gradient(90deg,#666,#999)");
    }
  });

  /* Trophées */
  const trophyDefs = [
    { id: "novice", name: "Novice", desc: "Atteins 100 XP", req: 100, emoji: "🌱" },
    { id: "apprenti", name: "Apprenti", desc: "Atteins 1 000 XP", req: 1000, emoji: "🏅" },
    { id: "heureux", name: "Heureux", desc: "Atteins 1 heure (1 000 XP)", req: 1000, emoji: "⏱️" },
    { id: "veteran", name: "Vétéran", desc: "Atteins 10 000 XP", req: 10000, emoji: "🥈" },
    { id: "insomnia", name: "Insomnia", desc: "12 heures = 12 000 XP (easter egg)", req: 12000, emoji: "🌙" },
    { id: "collector", name: "Collectionneur", desc: "Atteins 50 000 XP", req: 50000, emoji: "🏆" },
    // easter-egg trophy (no req) — NOT shown in the list, unlocked by interactions
    { id: "curious", name: "Curieux", desc: "Easter egg caché", req: 0, emoji: "🔍", hidden:true }
  ];

  let trophies = {}; // id -> unlocked info
  function loadTrophies(){ try{ const raw = localStorage.getItem(STORAGE_KEY + "_trophies"); if(raw) trophies = JSON.parse(raw); }catch(e){ trophies = {}; } }
  function saveTrophies(){ try{ localStorage.setItem(STORAGE_KEY + "_trophies", JSON.stringify(trophies)); }catch(e){ console.warn(e) } }
  function resetTrophies(){ trophies = {}; saveTrophies(); renderTrophies(); }

  function checkTrophies(){
    loadTrophies();
    let changed = false;
    for(const t of trophyDefs){
      if(t.hidden) continue; // don't auto-show hidden trophies
      if(!trophies[t.id] && state.totalXP >= t.req && t.req > 0){
        trophies[t.id] = { unlockedAt: Date.now() };
        changed = true;
        showToast(`Trophée débloqué : ${t.name} ${t.emoji}`);
        spawnConfetti();
      }
    }
    if(changed) saveTrophies();
    renderTrophies();
  }

  function unlockTrophyById(id){
    loadTrophies();
    if(!trophies[id]){
      trophies[id] = { unlockedAt: Date.now() };
      saveTrophies();
      renderTrophies();
      const t = trophyDefs.find(x=>x.id===id);
      showToast(`Trophée débloqué : ${t ? t.name : id}`);
      spawnConfetti();
    }
  }

  const trophyListEl = document.getElementById("trophyList");
  function renderTrophies(){
    loadTrophies();
    trophyListEl.innerHTML = "";
    // Only show trophies that require XP (req > 0). Hidden trophies (req==0 && hidden) are not displayed.
    const visible = trophyDefs.filter(t => t.req > 0);
    for(const t of visible){
      const unlocked = !!trophies[t.id];
      const tr = document.createElement("div");
      tr.className = "trophy" + (unlocked ? "" : " locked");
      tr.innerHTML = `<div class="icon">${t.emoji}</div>
                      <div class="meta"><div class="name">${t.name}</div><div class="req">${t.desc} • ${t.req.toLocaleString()} XP</div></div>`;
      trophyListEl.appendChild(tr);
    }
  }

  loadTrophies();
  renderTrophies();
  checkTrophies();

  /* Météo auto (réduite) */
  const weatherContent = document.getElementById("weatherContent");
  const locationNameEl = document.getElementById("locationName");
  const DEFAULT_CITY = { latitude: 48.8566, longitude: 2.3522, pretty: "Paris, France (fallback)" };

  document.getElementById("forceLocation").addEventListener("click", async ()=> await showWeather({force:true}));
  document.getElementById("fallbackCity").addEventListener("click", async ()=>{
    const city = prompt("Entrez le nom d'une ville (ex: Paris) :");
    if(city) await fetchWeatherByCity(city);
  });

  (async function initWeather(){ await showWeather(); })();

  async function showWeather(opts = {}) {
    const { force=false } = opts;
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Récupération de la position...</p>";

    let used = null;

    if(navigator.geolocation && !force){
      try{
        const pos = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:7000}));
        used = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
      }catch(err){ console.warn("Geoloc failed:", err); }
    }

    if(!used){
      try{
        const res = await fetch('https://ipapi.co/json/');
        if(res.ok){
          const ip = await res.json();
          if(ip && typeof ip.latitude!=='undefined' && typeof ip.longitude!=='undefined'){
            const cityLower = (ip.city || "").toLowerCase();
            const postal = ip.postal || "";
            if(cityLower.includes("amiens") || postal.startsWith("80")){
              used = { latitude: DEFAULT_CITY.latitude, longitude: DEFAULT_CITY.longitude, note: "fallback to Paris (override Amiens)" };
            } else {
              used = { latitude: ip.latitude, longitude: ip.longitude, pretty: (ip.city ? ip.city + (ip.region ? ", "+ip.region : "") + (ip.country_name ? ", " + ip.country_name : "") : null) };
            }
          }
        }
      }catch(e){ console.warn("IP lookup failed:", e); }
    }

    if(!used) used = { latitude: DEFAULT_CITY.latitude, longitude: DEFAULT_CITY.longitude, pretty: DEFAULT_CITY.pretty };

    await fetchWeather(used.latitude, used.longitude, used.pretty || null, used.note || null);
  }

  async function fetchWeather(lat, lon, knownLocationName = null, note = null){
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Chargement météo...</p>";
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      const cw = data.current_weather;
      if(!cw){ weatherContent.innerHTML = "<p>Météo indisponible.</p>"; return; }

      if(!knownLocationName){
        try{
          const revUrl = `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1&language=fr`;
          const rres = await fetch(revUrl);
          if(rres.ok){
            const rdata = await rres.json();
            if(rdata.results && rdata.results.length > 0){
              const r = rdata.results[0];
              knownLocationName = `${r.name}${r.admin1 ? ', '+r.admin1 : ''}${r.country ? ', '+r.country : ''}${r.postal_code ? ' ('+r.postal_code+')' : ''}`;
            }
          }
        }catch(e){}
      }

      if(knownLocationName) locationNameEl.textContent = knownLocationName + (note ? " • " + note : "");
      else locationNameEl.textContent = note || "";

      const temp = cw.temperature;
      const wind = cw.windspeed;
      const code = cw.weathercode;
      const desc = weatherCodeToText(code);
      weatherContent.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px">
          <div style="flex:0 0 auto"><div class="weather-temp">${Math.round(temp)}°C</div></div>
          <div style="flex:1"><div class="weather-desc">${desc}</div><div style="font-size:12px;color:var(--muted);margin-top:6px">Vent ${wind} km/h</div></div>
        </div>
      `;
    }catch(e){
      weatherContent.innerHTML = `<p>Erreur météo: ${e.message}</p>`;
    }
  }

  async function fetchWeatherByCity(city){
    locationNameEl.textContent = "";
    weatherContent.innerHTML = "<p>Recherche de la ville...</p>";
    try{
      const gurl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr`;
      const gres = await fetch(gurl);
      if(!gres.ok) throw new Error(gres.statusText);
      const gdata = await gres.json();
      if(!gdata.results || gdata.results.length === 0){
        weatherContent.innerHTML = `<p>Ville introuvable: ${city}</p>`;
        return;
      }
      const r = gdata.results[0];
      const pretty = `${r.name}${r.admin1 ? ', '+r.admin1 : ''}${r.country ? ', '+r.country : ''}${r.postal_code ? ' ('+r.postal_code+')' : ''}`;
      await fetchWeather(r.latitude, r.longitude, pretty);
    }catch(e){
      weatherContent.innerHTML = `<p>Erreur géocodage: ${e.message}</p>`;
    }
  }

  function weatherCodeToText(code){
    const map = {
      0:"Ciel clair",1:"Principalement ensoleillé",2:"Partiellement nuageux",3:"Couvert",
      45:"Brouillard",48:"Brouillard givrant",51:"Bruine légère",53:"Bruine modérée",55:"Bruine dense",
      56:"Bruine verglaçante",57:"Bruine verglaçante dense",61:"Pluie légère",63:"Pluie modérée",65:"Pluie forte",
      66:"Pluie verglaçante légère",67:"Pluie verglaçante forte",71:"Neige légère",73:"Neige modérée",75:"Neige forte",
      77:"Grains de neige",80:"Averses légères",81:"Averses modérées",82:"Averses violentes",85:"Averses de neige légères",
      86:"Averses de neige fortes",95:"Orage",96:"Orage avec grêle légère",99:"Orage avec grêle forte"
    };
    return map[code] || "Temps inconnu";
  }

  /* Easter-egg: hidden (no hint). Clicking time may unlock hidden trophy(s). */
  let clickCount = 0;
  timeEl.addEventListener("click", ()=>{
    clickCount++;
    if(clickCount >= 7){
      unlockTrophyById('curious'); // hidden trophy
      clickCount = 0;
    }
    clearTimeout(timeEl._clickTimeout);
    timeEl._clickTimeout = setTimeout(()=> clickCount = 0, 4000);
  });

  /* Confetti */
  function spawnConfetti(){
    const colors = ['#ffd166','#7c5cff','#00d4ff','#ff6b6b','#9be15d'];
    for(let i=0;i<18;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      const dx = (Math.random()-0.5)*800 + (Math.random()<0.5?-100:100);
      c.style.setProperty('--dx', dx + 'px');
      c.style.left = (window.innerWidth/2 + (Math.random()-0.5)*200) + 'px';
      c.style.top = (window.innerHeight*0.2 + (Math.random()-0.5)*200) + 'px';
      c.style.width = (6 + Math.random()*8) + 'px';
      c.style.height = (10 + Math.random()*8) + 'px';
      document.body.appendChild(c);
      setTimeout(()=> c.remove(), 1400);
    }
  }

  // initial checks
  checkTrophies();
  renderXP();

  // quick console note
  console.log("Horloge & XP prêtes — 12h = 12 000 XP.");
  </script>
</body>
</html>
