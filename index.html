<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Plaine 3D — Arbre principal (fix)</title>
  <style>
    html,body { height:100%; margin:0; background:#081226; font-family:system-ui,Segoe UI,Roboto,Arial; }
    #canvas { width:100%; height:100vh; display:block; }
    #hud {
      position:absolute; left:12px; top:12px; z-index:10;
      background:rgba(255,255,255,0.92); color:#111; padding:10px 14px; border-radius:8px;
      box-shadow:0 6px 18px rgba(0,0,0,0.18); font-weight:600; max-width:38%;
    }
    #detail { font-weight:400; font-size:13px; margin-top:6px; color:#333; }
    #credits { position:absolute; right:12px; bottom:12px; z-index:10;
      background:rgba(0,0,0,0.35); color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">Chargement météo...<div id="detail"></div></div>
  <div id="credits">Amiens (80000) — scène fixe — clic pour rafraîchir météo</div>

  <!-- Three.js UMD -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

  <script>
  (function () {
    // ---------- Configuration ----------
    const LAT = 49.8941, LON = 2.2958;
    const UPDATE_MIN = 5;

    // DOM
    const canvas = document.getElementById('canvas');
    const hud = document.getElementById('hud');

    // Basic error reporting to HUD
    function report(msg){
      console.error(msg);
      hud.textContent = msg;
    }
    window.addEventListener('error', e => report('Erreur JS: ' + (e.message || e)));
    window.addEventListener('unhandledrejection', e => report('Promise rejetée: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

    // WebGL check
    try {
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) { report('WebGL non disponible. Essaie un autre navigateur.'); return; }
    } catch (e) { report('WebGL non disponible.'); return; }

    if (typeof THREE === 'undefined') { report('Three.js non chargé depuis CDN.'); return; }

    // ---------- Renderer / Scene / Camera ----------
    const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setSize(window.innerWidth, window.innerHeight, false);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // day default, will adjust by weather
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.0009);

    // Fixed camera (non manipulable)
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(0, 14, 34);
    camera.lookAt(0, 6, 0);

    // Slight cinematic slow move (idle) but non-interactive
    let idleTime = 0;

    // ---------- Lights ----------
    const hemi = new THREE.HemisphereLight(0xffffff, 0x44444a, 0.6);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(18, 40, 10);
    dir.castShadow = true;
    dir.shadow.mapSize.set(2048, 2048);
    dir.shadow.camera.left = -60; dir.shadow.camera.right = 60;
    dir.shadow.camera.top = 60; dir.shadow.camera.bottom = -60;
    dir.shadow.camera.far = 200;
    scene.add(dir);

    const ambient = new THREE.AmbientLight(0x444444, 0.25);
    scene.add(ambient);

    // ---------- Ground (textured-ish) ----------
    const groundGeo = new THREE.PlaneGeometry(220, 220, 220, 220);
    groundGeo.rotateX(-Math.PI/2);
    // create subtle canvas-based grass texture
    function makeGroundTexture(){
      const c = document.createElement('canvas');
      c.width = c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#4b9b3a';
      ctx.fillRect(0,0,c.width,c.height);
      // draw noise and blades suggestion
      for (let i=0;i<9000;i++){
        const x = Math.random()*c.width;
        const y = Math.random()*c.height;
        const w = 1 + Math.random()*2;
        ctx.fillStyle = `rgba(${50+Math.floor(Math.random()*40)}, ${120+Math.floor(Math.random()*80)}, ${50+Math.floor(Math.random()*40)}, ${0.03 + Math.random()*0.07})`;
        ctx.fillRect(x,y,w,1);
      }
      return new THREE.CanvasTexture(c);
    }
    const groundMat = new THREE.MeshStandardMaterial({map: makeGroundTexture(), roughness:0.95});
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.receiveShadow = true;
    scene.add(ground);

    // keep base positions for gentle hills
    const basePos = ground.geometry.attributes.position.array.slice();

    // ---------- Grass: instanced subtle blades ----------
    const bladeGeo = new THREE.PlaneGeometry(0.18, 1.0);
    const bladeMat = new THREE.MeshToonMaterial({color: 0x1e6b29, side: THREE.DoubleSide});
    const bladeCount = 2000;
    const blades = new THREE.InstancedMesh(bladeGeo, bladeMat, bladeCount);
    blades.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const tmp = new THREE.Object3D();
    for (let i=0;i<bladeCount;i++){
      tmp.position.set((Math.random()-0.5)*160, 0.02 + Math.random()*0.02, (Math.random()-0.5)*160);
      tmp.rotation.y = Math.random()*Math.PI;
      const s = 0.8 + Math.random()*1.6;
      tmp.scale.set(s*0.8, s, 1);
      tmp.updateMatrix();
      blades.setMatrixAt(i, tmp.matrix);
    }
    scene.add(blades);

    // ---------- Textures for bark & leaf (canvas) ----------
    function makeBarkTexture(){
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#6b4126';
      ctx.fillRect(0,0,c.width,c.height);
      // vertical grain
      for (let i=0;i<1500;i++){
        const x = Math.random()*c.width;
        ctx.fillStyle = `rgba(40,20,10,${0.03 + Math.random()*0.08})`;
        ctx.fillRect(x, 0, 1, c.height);
      }
      // knots
      for (let i=0;i<180;i++){
        ctx.fillStyle = `rgba(30,15,8,${0.05 + Math.random()*0.15})`;
        const cx = Math.random()*c.width;
        const cy = Math.random()*c.height;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 6+Math.random()*12, 3+Math.random()*6, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }
    function makeLeafTexture(){
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.clearRect(0,0,c.width,c.height);
      ctx.fillStyle = '#2fa845';
      ctx.beginPath();
      ctx.ellipse(64,64,46,28,0,0,Math.PI*2);
      ctx.fill();
      // central vein
      ctx.strokeStyle = 'rgba(20,60,20,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(64,16);
      ctx.quadraticCurveTo(66,64,64,112);
      ctx.stroke();
      return new THREE.CanvasTexture(c);
    }
    const barkTex = makeBarkTexture();
    const leafTex = makeLeafTexture();

    // ---------- Detailed main tree ----------
    function createMainTree(){
      const tree = new THREE.Group();

      // trunk: tall cylinder with many segments, then bend vertices
      const h = 12;
      const trunkGeo = new THREE.CylinderGeometry(1.2, 1.6, h, 18, 64);
      // deform for natural curve
      for (let i=0;i<trunkGeo.attributes.position.count;i++){
        const y = trunkGeo.attributes.position.getY(i);
        const ratio = (y + h/2) / h; // 0..1 bottom->top
        const bend = Math.sin(ratio * Math.PI) * 0.9; // curve amplitude
        const x = trunkGeo.attributes.position.getX(i);
        const z = trunkGeo.attributes.position.getZ(i);
        trunkGeo.attributes.position.setX(i, x + bend * 0.8 * Math.sin(ratio * 2.1));
        trunkGeo.attributes.position.setZ(i, z + bend * 0.5 * Math.cos(ratio * 1.7));
      }
      trunkGeo.computeVertexNormals();
      const trunkMat = new THREE.MeshStandardMaterial({map: barkTex, roughness:1});
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      trunk.position.y = h/2 - 0.1;
      tree.add(trunk);

      // generate branches: parametric cylinders attached to trunk
      const branchMat = new THREE.MeshStandardMaterial({color:0x6b4426, roughness:1});
      const branchCount = 16;
      const leavesGroup = new THREE.Group(); // collect leaf instances here
      // we'll create many leaves via InstancedMesh for performance
      const leavesPerBranch = 120;
      const totalLeaves = branchCount * leavesPerBranch;
      const leafPlane = new THREE.PlaneGeometry(0.5, 0.8);
      const leafMat = new THREE.MeshLambertMaterial({map: leafTex, transparent:true, side: THREE.DoubleSide});
      const leafInst = new THREE.InstancedMesh(leafPlane, leafMat, totalLeaves);
      leafInst.castShadow = false; leafInst.receiveShadow = false;

      let leafIdx = 0;
      for (let b=0;b<branchCount;b++){
        const t = Math.random()*0.75 + 0.25; // position along trunk (0..1)
        const angle = b / branchCount * Math.PI * 2 + (Math.random()-0.5) * 0.5;
        const length = 4 + Math.random()*4;
        const brGeo = new THREE.CylinderGeometry(0.08, 0.18, length, 8);
        const br = new THREE.Mesh(brGeo, branchMat);
        // pivot at base
        const pivot = new THREE.Object3D();
        // compute attach pos on trunk roughly
        const attachY = 1 + t * (h - 2);
        const attachX = Math.cos(angle) * (1.2 + t*0.6);
        const attachZ = Math.sin(angle) * (1.2 + t*0.6);
        pivot.position.set(attachX, attachY, attachZ);
        // orient branch outward and slightly upward
        const axis = new THREE.Vector3(Math.cos(angle), 0.4 + Math.random()*0.25, Math.sin(angle)).normalize();
        br.rotation.z = Math.random() * 0.6;
        br.position.y = length/2;
        pivot.add(br);
        tree.add(pivot);

        // add leaves around tip region
        for (let L=0; L<leavesPerBranch; L++){
          const dummy = new THREE.Object3D();
          const r = length * (0.3 + Math.random()*0.7);
          const ang = Math.random()*Math.PI*2;
          const x = attachX + Math.cos(angle)*r + (Math.random()-0.5)*0.6;
          const y = attachY + (Math.random()*1.2) + (r*0.06);
          const z = attachZ + Math.sin(angle)*r + (Math.random()-0.5)*0.6;
          dummy.position.set(x, y, z);
          dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
          const s = 0.6 + Math.random()*0.9;
          dummy.scale.setScalar(s);
          dummy.updateMatrix();
          leafInst.setMatrixAt(leafIdx++, dummy.matrix);
        }
      }
      leafInst.instanceMatrix.needsUpdate = true;
      leavesGroup.add(leafInst);
      tree.add(leavesGroup);

      // canopy top cluster: several big leaf spheres softened (cartoon look)
      const canopy = new THREE.Group();
      const leafBallMat = new THREE.MeshToonMaterial({color: 0x2da14a, flatShading: true});
      const canopyLayers = 6;
      for (let i=0;i<canopyLayers;i++){
        const r = 4.8 - i*0.6;
        const s = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), leafBallMat);
        s.position.set((Math.random()-0.5)*0.6, 8 + i*0.6, (Math.random()-0.5)*0.6);
        s.castShadow = true; s.receiveShadow = true;
        canopy.add(s);
      }
      tree.add(canopy);

      // store references for animation
      tree.userData = { leavesMesh: leafInst, canopy: canopy, trunk: trunk, swayOffset: Math.random()*1000, leafFallAccumulator: 0 };
      return tree;
    }

    const mainTree = createMainTree();
    mainTree.position.set(0, 0, 0);
    scene.add(mainTree);

    // ---------- Surrounding trees (detailed but smaller) ----------
    function createSmallTree(scale=0.6){
      const g = new THREE.Group();
      const h = 6 * scale;
      const trunkGeo = new THREE.CylinderGeometry(0.25*scale, 0.4*scale, h, 12, 18);
      const trunk = new THREE.Mesh(trunkGeo, new THREE.MeshStandardMaterial({map: barkTex, roughness:1}));
      trunk.position.y = h/2;
      trunk.castShadow = true; trunk.receiveShadow = true;
      g.add(trunk);
      const leafMat = new THREE.MeshToonMaterial({color: 0x2fb24a, flatShading:true});
      for (let i=0;i<3;i++){
        const sph = new THREE.Mesh(new THREE.SphereGeometry(1.2*scale * (1.2 - i*0.15), 12, 8), leafMat);
        sph.position.y = h - 1 + i*0.6;
        sph.position.x = (Math.random()-0.5)*0.25;
        sph.castShadow = true; sph.receiveShadow = true;
        g.add(sph);
      }
      g.userData = { swayOffset: Math.random()*500 };
      return g;
    }

    // scatter
    for (let i=0;i<28;i++){
      const t = createSmallTree(0.6 + Math.random()*0.9);
      const r = 9 + Math.random()*72;
      const ang = Math.random()*Math.PI*2;
      t.position.set(Math.cos(ang)*r, 0, Math.sin(ang)*r);
      t.rotation.y = Math.random()*Math.PI;
      scene.add(t);
    }

    // ---------- Falling leaves pool (dynamic) ----------
    const fallingLeavesGeo = new THREE.BufferGeometry();
    const maxFall = 600;
    const fallPos = new Float32Array(maxFall * 3);
    const fallVel = new Float32Array(maxFall);
    let fallCount = 0;
    for (let i=0;i<maxFall;i++){
      fallPos[i*3] = 9999; fallPos[i*3+1]=9999; fallPos[i*3+2]=9999;
      fallVel[i] = 0;
    }
    fallingLeavesGeo.setAttribute('position', new THREE.BufferAttribute(fallPos, 3));
    const fallMat = new THREE.PointsMaterial({map: leafTex, size: 0.8, transparent: true, depthWrite:false});
    const fallingLeaves = new THREE.Points(fallingLeavesGeo, fallMat);
    scene.add(fallingLeaves);

    // ---------- Weather state & fetch ----------
    function weatherCodeToType(code){
      if (code === 0) return 'clear';
      if (code === 1 || code === 2) return 'partly_cloudy';
      if (code === 3) return 'cloudy';
      if (code === 45 || code === 48) return 'fog';
      if (code >= 51 && code <= 57) return 'drizzle';
      if (code >= 61 && code <= 67) return 'rain';
      if (code >= 71 && code <= 77) return 'snow';
      if (code >= 80 && code <= 82) return 'rain';
      if (code >= 85 && code <= 86) return 'snow';
      if (code >= 95 && code <= 99) return 'thunder';
      return 'cloudy';
    }

    const state = { weatherType: 'clear', temperature: 12, wind: 2, intensity: 0, timeOfDay: 'day' };

    async function fetchWeather(){
      try {
        hud.textContent = 'Mise à jour météo...';
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&timezone=Europe%2FParis`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Erreur réseau: ' + res.status);
        const json = await res.json();
        if (!json.current_weather) throw new Error('Aucune donnée météo reçue');
        const cw = json.current_weather;
        state.weatherType = weatherCodeToType(cw.weathercode);
        state.temperature = Math.round(cw.temperature);
        state.wind = cw.windspeed || 0;
        state.intensity = Math.min(1, (cw.windspeed || 0)/28);
        const localHour = new Date(cw.time + '+02:00').getHours();
        state.timeOfDay = (localHour>=6 && localHour<20)?'day':'night';
        hud.innerHTML = `Amiens — ${state.temperature}°C — ${state.weatherType} — vent ${Math.round(state.wind)} km/h` +
                        `<div id="detail">Clique pour rafraîchir</div>`;
        applyWeatherToScene();
      } catch (err) {
        report('Impossible de récupérer la météo: ' + (err.message || err));
      }
    }

    // apply weather (sky, fog, rain/snow creation)
    let rainPoints = null, rainGeo = null, rainVel = null;
    let snowPoints = null, snowGeo = null, snowVel = null;
    function createRain(count){
      if (rainPoints) { scene.remove(rainPoints); rainPoints.geometry.dispose(); rainPoints.material.dispose(); rainPoints = null; }
      rainGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(count*3);
      rainVel = new Float32Array(count);
      for (let i=0;i<count;i++){
        pos[i*3] = (Math.random()-0.5)*180;
        pos[i*3+1] = Math.random()*40 + 10;
        pos[i*3+2] = (Math.random()-0.5)*180;
        rainVel[i] = 60 + Math.random()*60;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({color: 0xa6d8ff, size: 0.12, transparent:true, opacity:0.9, depthWrite:false});
      rainPoints = new THREE.Points(rainGeo, mat);
      scene.add(rainPoints);
    }
    function createSnow(count){
      if (snowPoints) { scene.remove(snowPoints); snowPoints.geometry.dispose(); snowPoints.material.dispose(); snowPoints = null; }
      snowGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(count*3);
      snowVel = new Float32Array(count);
      for (let i=0;i<count;i++){
        pos[i*3] = (Math.random()-0.5)*180;
        pos[i*3+1] = Math.random()*40 + 10;
        pos[i*3+2] = (Math.random()-0.5)*180;
        snowVel[i] = 6 + Math.random()*6;
      }
      snowGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({color:0xffffff, size:0.32, transparent:true, opacity:0.95, depthWrite:false});
      snowPoints = new THREE.Points(snowGeo, mat);
      scene.add(snowPoints);
    }

    function applyWeatherToScene(){
      // sky and fog
      if (state.timeOfDay === 'day'){
        scene.background.set(0x87CEEB);
        scene.fog.color.setHex(0x87CEEB);
        scene.fog.density = 0.0009 + state.intensity*0.002;
        hemi.intensity = 0.7;
        dir.intensity = 1.0 - state.intensity*0.5;
      } else {
        scene.background.set(0x081226);
        scene.fog.color.setHex(0x081226);
        scene.fog.density = 0.0012 + state.intensity*0.002;
        hemi.intensity = 0.18;
        dir.intensity = 0.35;
      }

      // rain / snow
      if (state.weatherType === 'rain' || state.weatherType === 'drizzle' || state.weatherType === 'thunder'){
        createRain(Math.floor(800 + state.intensity * 2200));
        if (snowPoints) { scene.remove(snowPoints); snowPoints = null; }
      } else if (state.weatherType === 'snow'){
        createSnow(Math.floor(400 + state.intensity * 900));
        if (rainPoints) { scene.remove(rainPoints); rainPoints = null; }
      } else {
        if (rainPoints) { scene.remove(rainPoints); rainPoints = null; }
        if (snowPoints) { scene.remove(snowPoints); snowPoints = null; }
      }

      // if wind strong, spawn falling leaves gradually
      if (state.wind > 8) {
        // increase fall quota
        mainTree.userData.leafFallAccumulator = Math.min(1.0, (mainTree.userData.leafFallAccumulator || 0) + (state.wind - 6) * 0.02);
      } else {
        mainTree.userData.leafFallAccumulator = Math.max(0, (mainTree.userData.leafFallAccumulator || 0) - 0.01);
      }
    }

    // ---------- Animation loop ----------
    let last = performance.now();
    function animate(now){
      requestAnimationFrame(animate);
      const dt = (now - last) / 1000;
      last = now;
      idleTime += dt;

      // slight cinematic camera idle (no user control)
      const idleStrength = 0.08;
      camera.position.x = Math.sin(idleTime*0.06) * idleStrength + 0;
      camera.position.y = 14 + Math.sin(idleTime*0.03) * 0.2;
      camera.lookAt(0, 6, 0);

      // deform ground for gentle rolling
      const pos = ground.geometry.attributes.position.array;
      for (let i=0;i<pos.length;i+=3){
        const bx = basePos[i], bz = basePos[i+2];
        const d = Math.sin(bx*0.05 + now*0.0006) * 0.6 + Math.cos(bz*0.04 + now*0.0008) * 0.35;
        const windEffect = Math.sin((bx + bz)*0.02 + now*0.0009) * (state.wind*0.01);
        pos[i+1] = (d * 0.85) + windEffect * 0.5;
      }
      ground.geometry.attributes.position.needsUpdate = true;
      ground.geometry.computeVertexNormals();

      // blades sway (update instanced matrices)
      const dummy = new THREE.Object3D();
      for (let i=0;i<bladeCount;i++){
        blades.getMatrixAt(i, dummy.matrix);
        dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
        const sway = Math.sin(now*0.001 + i) * (0.02 + state.wind*0.007);
        dummy.rotation.set(0, 0, sway);
        dummy.updateMatrix();
        blades.setMatrixAt(i, dummy.matrix);
      }
      blades.instanceMatrix.needsUpdate = true;

      // tree sway: main tree slightly heavier
      const canopy = mainTree.userData.canopy;
      const leavesInst = mainTree.userData.leavesMesh;
      const baseSway = (0.015 + state.wind*0.005);
      const s = Math.sin(now*0.0015 + mainTree.userData.swayOffset) * baseSway * 1.6;
      mainTree.rotation.z = s * 0.7;
      if (canopy){
        canopy.rotation.z = s * 1.0;
      }
      // leaf instanced slight per-instance transform update to simulate flutter when wind
      if (leavesInst){
        const Lcount = leavesInst.count;
        const mat = new THREE.Matrix4();
        for (let i=0;i<Lcount;i++){
          // fetch previous matrix, decompose, tweak
          leavesInst.getMatrixAt(i, mat);
          mat.decompose(dummy.position, dummy.quaternion, dummy.scale);
          const flutter = Math.sin(now*0.002 + i*0.13) * (0.02 + state.wind*0.008);
          dummy.rotation.set(dummy.rotation.x + flutter, dummy.rotation.y + flutter*0.3, dummy.rotation.z + flutter*0.6);
          dummy.updateMatrix();
          leavesInst.setMatrixAt(i, dummy.matrix);
        }
        leavesInst.instanceMatrix.needsUpdate = true;
      }

      // rain update
      if (rainPoints && rainGeo){
        const p = rainGeo.attributes.position.array;
        for (let i=0;i<p.length;i+=3){
          p[i+1] -= rainVel[i/3] * dt;
          p[i] += (state.wind * 0.08) * dt * 40;
          if (p[i+1] < 0) {
            p[i+1] = 40 + Math.random()*12;
            p[i] = (Math.random()-0.5)*180;
            p[i+2] = (Math.random()-0.5)*180;
          }
        }
        rainGeo.attributes.position.needsUpdate = true;
      }
      // snow update
      if (snowPoints && snowGeo){
        const p = snowGeo.attributes.position.array;
        for (let i=0;i<p.length;i+=3){
          p[i+1] -= snowVel[i/3] * dt;
          p[i] += Math.sin(now*0.0005 + i) * 0.02 + state.wind*0.02;
          if (p[i+1] < 0) {
            p[i+1] = 40 + Math.random()*12;
            p[i] = (Math.random()-0.5)*180;
            p[i+2] = (Math.random()-0.5)*180;
          }
        }
        snowGeo.attributes.position.needsUpdate = true;
      }

      // falling leaves logic: when accumulator high, spawn some
      if (mainTree.userData.leafFallAccumulator > 0.03){
        const spawn = Math.floor(mainTree.userData.leafFallAccumulator * 8);
        for (let k=0;k<spawn;k++){
          // find empty slot
          for (let i=0;i<maxFall;i++){
            const y = fallPos[i*3+1];
            if (y > 9000){ // unused
              // spawn near canopy
              fallPos[i*3] = (Math.random()-0.5)*6 + 0; // around trunk
              fallPos[i*3+1] = 8 + Math.random()*6;
              fallPos[i*3+2] = (Math.random()-0.5)*6;
              fallVel[i] = 0.2 + Math.random()*0.6 + state.wind*0.02;
              fallCount = Math.min(maxFall, fallCount+1);
              break;
            }
          }
        }
        mainTree.userData.leafFallAccumulator = Math.max(0, mainTree.userData.leafFallAccumulator - 0.02);
      }
      // update falling leaves
      for (let i=0;i<maxFall;i++){
        if (fallPos[i*3+1] < 9000){
          fallVel[i] += 9.8 * dt * 0.02; // gravity small
          fallPos[i*3+1] -= fallVel[i] * dt * 8;
          fallPos[i*3] += (state.wind*0.02 + Math.sin(now*0.001+i)*0.01) * dt * 40;
          if (fallPos[i*3+1] < 0.2){
            // retire leaf
            fallPos[i*3] = 9999; fallPos[i*3+1] = 9999; fallPos[i*3+2] = 9999;
            fallVel[i] = 0;
            fallCount = Math.max(0, fallCount-1);
          }
        }
      }
      fallingLeaves.geometry.attributes.position.needsUpdate = true;

      // render
      renderer.render(scene, camera);
    }

    // ---------- Interaction: click to fetch weather ----------
    canvas.addEventListener('click', () => {
      fetchWeather();
    });
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ---------- Start ----------
    fetchWeather();
    setInterval(fetchWeather, UPDATE_MIN * 60 * 1000);
    animate(performance.now());
  })();
  </script>
</body>
</html>
